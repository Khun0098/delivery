<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<title>Plataforma Delivery</title>
<style>
  :root { --bg: #f3f0f8; --painel: #ffffff; --fg: #1f1230; --mut: #655a74; --linha: #ddd5ea; --acc: #3a1161; --acc-fg: #ffffff; --lima: #a6e03d; --aviso: #fff3cf; --aviso-fg: #5c4300; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #120d1a; --painel: #1b1327; --fg: #f1eafa; --mut: #a99bbd; --linha: #31254a; --acc: #a6e03d; --acc-fg: #1f1230; --aviso: #3a2f0e; --aviso-fg: #ffd978; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #120d1a; --painel: #1b1327; --fg: #f1eafa; --mut: #a99bbd; --linha: #31254a; --acc: #a6e03d; --acc-fg: #1f1230; --aviso: #3a2f0e; --aviso-fg: #ffd978; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .barra { background: var(--painel); border-bottom: 1px solid var(--linha); padding-block: 10px; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
  .barra h1 { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
  .abas { display: flex; gap: 4px; flex-wrap: wrap; }
  .abas button { border: 1px solid var(--linha); background: transparent; color: var(--fg); padding: 7px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .abas button[aria-pressed="true"] { background: var(--acc); color: var(--acc-fg); border-color: var(--acc); }
  .abas button:focus-visible, .dica button:focus-visible, .reset:focus-visible { outline: 3px solid var(--lima); outline-offset: 2px; }
  .reset { margin-left: auto; border: 0; background: transparent; color: var(--mut); text-decoration: underline; cursor: pointer; font: inherit; }
  .dicas { background: var(--painel); border-bottom: 1px solid var(--linha); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; color: var(--mut); }
  .dica { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .dica code { background: var(--bg); padding: 2px 6px; border-radius: 4px; color: var(--fg); overflow-wrap: anywhere; }
  .dica button { border: 1px solid var(--linha); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 3px 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .aviso { background: var(--aviso); color: var(--aviso-fg); padding-block: 6px; font-size: .85rem; }
  .palco { flex: 1; min-height: 0; display: flex; gap: 2px; background: var(--linha); }
  .palco iframe { display: none; flex: 1; min-width: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .palco[data-modo="cliente"] #f-cliente, .palco[data-modo="vendedor"] #f-vendedor, .palco[data-modo="admin"] #f-admin,
  .palco[data-modo="duplo"] #f-cliente, .palco[data-modo="duplo"] #f-vendedor { display: block; }
  @media (max-width: 899px) { .so-largo { display: none; } }
</style>
<header class="barra gutter">
  <h1>Plataforma Delivery</h1>
  <div class="abas" role="group" aria-label="Escolha o site">
    <button type="button" data-modo="cliente" aria-pressed="true">Site do cliente</button>
    <button type="button" data-modo="vendedor" aria-pressed="false">Site do vendedor</button>
    <button type="button" data-modo="admin" aria-pressed="false">Admin</button>
    <button type="button" data-modo="duplo" aria-pressed="false" class="so-largo">Cliente e vendedor lado a lado</button>
  </div>
  <button type="button" class="reset" id="reset">Reiniciar demonstração</button>
</header>
<div class="dicas gutter" id="dicas"></div>
<div class="aviso gutter">Demonstração com dados fictícios, guardados só nesta página. Os três sites são o código real do projeto; o servidor é simulado aqui dentro.</div>
<main class="palco" id="palco" data-modo="cliente"></main>
<script>/* Servidor SIMULADO para a demonstração. Roda dentro da página, guarda tudo em memória e reproduz as regras do backend real
   (apps/api): validação de pedido, transições de status, isolamento por loja e eventos em tempo real. */
(() => {
  'use strict';
  const TZ = -3;
  const nowIso = () => new Date().toISOString();
  const clone = (x) => JSON.parse(JSON.stringify(x));
  class Err extends Error { constructor(status, msg, codigo) { super(msg); this.status = status; this.codigo = codigo; } }
  const bad = (m) => new Err(422, m, 'VALIDACAO');
  let ID = 1000; const nid = () => ++ID;

  const S = { est: [], horarios: [], cats: [], prods: [], users: [], enderecos: [], pedidos: [], audit: [] };
  const sessions = { cliente: null, vendedor: null, admin: null };

  // ---------- dados de demonstração (mesmo cardápio do seed real) ----------
  const GRATIS = ['Cereal chocoball', 'Paçoca', 'Granola', 'Coco ralado', 'Granulado de chocolate'];
  const CALDAS = ['Caramelo', 'Leite condensado', 'Chocolate', 'Morango'];
  const EXTRAS = ['Ovomaltine', 'Confetes de chocolates', 'Leite em pó', 'Granola', 'Paçoca', 'Nestón', 'Coco ralado', 'Granulado de chocolate'];
  const ops = (nomes, preco) => nomes.map((nome) => ({ id: nid(), nome, preco_adicional: preco, imagem_url: null, ativo: true }));
  const grupo = (titulo, descricao, minimo, maximo, opcoes) => ({ id: nid(), titulo, descricao, minimo, maximo, opcoes });
  const est = (o) => { const e = { id: nid(), logo_url: null, banner_url: null, telefone: '11999990001', aberto_manual: true, aceita_retirada: true, ativo: true, criado_em: nowIso(), ...o }; S.est.push(e); return e; };
  const cat = (e, nome) => { const c = { id: nid(), est: e.id, nome, ordem: S.cats.filter((x) => x.est === e.id).length + 1, ativa: true }; S.cats.push(c); return c; };
  const prod = (e, c, nome, descricao, preco, orig = null, grupos = [], r18 = false) => { const p = { id: nid(), est: e.id, categoria_id: c.id, nome, descricao, preco, preco_original: orig, imagem_url: null, ativo: true, restrito_18: r18, grupos }; S.prods.push(p); return p; };
  const user = (tipo, nome, email, senha, estId = null, telefone = null) => { const u = { id: nid(), tipo, nome, email, senha, est: estId, telefone, ativo: true }; S.users.push(u); return u; };

  function seed() {
    const a = est({ slug: 'acai-papum', nome: 'Açaí Papum', descricao: 'Pediu, chegou, gelou! Açaí cremoso, puro e geladinho, sem cristais de gelo.', categoria: 'Açaí', endereco: 'Centro', pedido_minimo: 990, taxa_entrega: 0, tempo_min: 43, tempo_max: 53 });
    const c1 = cat(a, 'Pápum Gourmet - Monte seu Açaí'), c2 = cat(a, 'Bebidas');
    prod(a, c1, 'Açaí Artesanal de 200ml + 3 complementos grátis', 'Açaí cremoso, puro e geladinho, sem cristais de gelo. Escolha até 3 acompanhamentos grátis. Monte o seu.', 1490, 1990, [
      grupo('Adicionais Grátis', 'Escolha pelo menos 1 opção (até 3).', 1, 3, ops(GRATIS, 0)), grupo('Caldas', 'Escolha até 1 opção.', 0, 1, ops(CALDAS, 0)), grupo('Que tal acrescentar mais?', 'Escolha até 4 opções.', 0, 4, ops(EXTRAS, 250))]);
    prod(a, c1, 'Combo Duas Tentações Cookies & Cream + Ferrero Rocher 200ml', 'Duas tentações em um só pedido! De um lado, a cremosidade irresistível do Cookies & Cream. Do outro, a explosão de sabor do Ferrero Rocher.', 3890, 5990);
    prod(a, c1, 'Pápum Gourmet - Cookies & Cream', 'Creme de Cookies & Cream. Uma combinação irresistível de creme aveludado com o sabor inconfundível de Cookies.', 2290, 2990);
    prod(a, c1, 'Pápum Gourmet - Trufadão Ferrero Rocher + 2 complementos grátis', 'O clássico bombom virou açaí! Copo intensamente recheado com camadas da legítima Nutella pura e a crocância irresistível do Ferrero Rocher.', 2290, 2990, [grupo('Complementos grátis', 'Escolha até 2 opções.', 0, 2, ops(GRATIS, 0))]);
    prod(a, c1, 'Pápum Gourmet - Trufadão Ninho c/ Nutella + 2 complementos grátis', 'O verdadeiro trufado! Copo mega recheado com camadas generosas de Nutella pura e nosso exclusivo e cremoso creme de Ninho.', 2290, 2990, [grupo('Complementos grátis', 'Escolha até 2 opções.', 0, 2, ops(GRATIS, 0))]);
    prod(a, c2, 'Coca-Cola Pet Mini 200 ml', 'Garrafa 200ml.', 399);
    prod(a, c2, 'Água Mineral com Gás 500ml Passa Quatro', 'Garrafa 500ml.', 700);
    prod(a, c2, 'Cerveja Heineken Latão', 'Cerveja Heineken latão. Venda proibida para menores de 18 anos.', 1200, null, [], true);
    const b = est({ slug: 'pizzaria-demo', nome: 'Pizzaria Demo', descricao: 'Pizzas artesanais no forno a lenha.', categoria: 'Pizza', endereco: 'Bairro Jardim', pedido_minimo: 2500, taxa_entrega: 500, tempo_min: 40, tempo_max: 60 });
    const cb = cat(b, 'Pizzas');
    prod(b, cb, 'Pizza Margherita', 'Molho de tomate, muçarela e manjericão.', 4500);
    prod(b, cb, 'Pizza Calabresa', 'Calabresa fatiada e cebola.', 4800);
    user('admin', 'Administrador Geral', 'admin@delivery.local', 'Admin#12345');
    user('vendedor', 'Dono do Açaí Papum', 'vendedor@acaipapum.local', 'Vendedor#12345', a.id);
    user('vendedor', 'Dono da Pizzaria', 'vendedor@pizzariademo.local', 'Vendedor#12345', b.id);
    user('cliente', 'Cliente Teste', 'cliente@teste.local', 'Cliente#12345', null, '11999990000');
  }
  seed();

  // ---------- utilidades de regra ----------
  const STATUS_LABEL = { aguardando_pagamento: 'Aguardando pagamento', novo: 'Aguardando aceite', preparando: 'Em preparo', pronto: 'Pronto', em_entrega: 'Saiu para entrega', entregue: 'Entregue', recusado: 'Recusado', cancelado: 'Cancelado' };
  const FORMAS = { pix: { label: 'Pix', online: true }, cartao_credito: { label: 'Cartão de crédito na entrega', online: false }, cartao_debito: { label: 'Cartão de débito na entrega', online: false }, dinheiro: { label: 'Dinheiro', online: false } };
  const TRANS = { novo: ['preparando', 'recusado'], preparando: ['pronto', 'cancelado'], pronto: ['em_entrega', 'entregue', 'cancelado'], em_entrega: ['entregue', 'cancelado'] };
  const toMin = (s) => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
  const horariosDe = (id) => S.horarios.filter((h) => h.est === id).map(({ dia_semana, abre, fecha }) => ({ dia_semana, abre, fecha })).sort((a, b) => a.dia_semana - b.dia_semana || toMin(a.abre) - toMin(b.abre));

  function statusFunc(e) {
    const hs = horariosDe(e.id);
    if (!e.ativo) return { aberto: false, motivo: 'inativo', abre_as: null, abre_hoje: false };
    if (!e.aberto_manual) return { aberto: false, motivo: 'pausado', abre_as: null, abre_hoje: false };
    if (!hs.length) return { aberto: true, motivo: null, abre_as: null, abre_hoje: false };
    const local = new Date(Date.now() + TZ * 3600e3), dia = local.getUTCDay(), min = local.getUTCHours() * 60 + local.getUTCMinutes();
    for (const h of hs) {
      const a = toMin(h.abre), f = toMin(h.fecha);
      if (h.dia_semana === dia && (f > a ? min >= a && min < f : min >= a)) return { aberto: true, motivo: null, abre_as: null, abre_hoje: false };
      if (h.dia_semana === (dia + 6) % 7 && f <= a && min < f) return { aberto: true, motivo: null, abre_as: null, abre_hoje: false };
    }
    const hoje = hs.filter((h) => h.dia_semana === dia && toMin(h.abre) > min);
    if (hoje.length) return { aberto: false, motivo: 'fechado', abre_as: hoje[0].abre, abre_hoje: true };
    for (let i = 1; i <= 7; i++) { const d = (dia + i) % 7; const x = hs.filter((h) => h.dia_semana === d); if (x.length) return { aberto: false, motivo: 'fechado', abre_as: x[0].abre, abre_hoje: false, abre_dia: d }; }
    return { aberto: false, motivo: 'fechado', abre_as: null, abre_hoje: false };
  }
  const dayRange = (str) => {
    const off = TZ * 3600e3; let ini;
    if (str) { if (!/^\d{4}-\d{2}-\d{2}$/.test(str)) throw bad('Data inválida'); ini = Date.parse(str + 'T00:00:00Z'); } else ini = Math.floor((Date.now() + off) / 86400e3) * 86400e3;
    return { inicio: new Date(ini - off).toISOString(), fim: new Date(ini - off + 86400e3).toISOString() };
  };
  const str = (x, label, { min = 1, max = 255, optional = false } = {}) => {
    if (x === undefined || x === null || x === '') { if (optional) return null; throw bad(`${label} é obrigatório`); }
    if (typeof x !== 'string') throw bad(`${label} inválido`);
    const s = x.trim(); if (s.length < min) throw bad(`${label} deve ter ao menos ${min} caractere(s)`); if (s.length > max) throw bad(`${label} é longo demais`); return s;
  };
  const int = (x, label, { min = 0, max = 1e9, optional = false } = {}) => {
    if (x === undefined || x === null || x === '') { if (optional) return null; throw bad(`${label} é obrigatório`); }
    if (!Number.isInteger(x) || x < min || x > max) throw bad(`${label} inválido`); return x;
  };
  const audit = (u, acao, detalhe) => S.audit.unshift({ id: nid(), usuario_id: u?.id ?? null, tipo: u?.tipo ?? null, estabelecimento_id: u?.est ?? null, acao, detalhe: detalhe ?? null, ip: 'demo', criado_em: nowIso() });

  // ---------- tempo real ----------
  const channels = new Map();
  function publish(ch, ev, data) { (channels.get(ch) || []).forEach((cb) => { try { cb(ev, clone(data)); } catch { /* aba fechada */ } }); }
  function subscribe(area, cb) {
    const u = userFor(area); if (!u) return null;
    const ch = area === 'vendedor' ? `loja:${u.est}` : `cliente:${u.id}`;
    if (!channels.has(ch)) channels.set(ch, new Set()); channels.get(ch).add(cb);
    return () => channels.get(ch)?.delete(cb);
  }

  // ---------- pedidos ----------
  const codigo = () => { const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c; do { c = 'PP'; for (let i = 0; i < 6; i++) c += al[Math.floor(Math.random() * al.length)]; } while (S.pedidos.some((p) => p.codigo === c)); return c; };
  const view = (p) => {
    const e = S.est.find((x) => x.id === p.est);
    return { id: p.id, codigo: p.codigo, status: p.status, status_label: STATUS_LABEL[p.status], estabelecimento_id: p.est, estabelecimento: { id: e.id, nome: e.nome, slug: e.slug, telefone: e.telefone, logo_url: e.logo_url }, cliente_id: p.cliente_id,
      tipo_entrega: p.tipo_entrega, endereco: p.endereco, cliente_nome: p.cliente_nome, cliente_telefone: p.cliente_telefone, subtotal: p.subtotal, taxa_entrega: p.taxa_entrega, total: p.total,
      forma_pagamento: p.forma, forma_pagamento_label: FORMAS[p.forma].label, pagamento_status: p.pagamento_status, troco_para: p.troco_para, observacao: p.observacao, motivo: p.motivo, pix_payload: p.pix_payload,
      publicado_em: p.publicado_em, criado_em: p.criado_em, atualizado_em: p.atualizado_em, itens: p.itens, historico: p.historico };
  };
  const paraLoja = (p) => { const v = view(p); delete v.pix_payload; return v; };
  function notificar(p, evLoja = 'pedido.atualizado') {
    if (p.publicado_em) publish(`loja:${p.est}`, evLoja, paraLoja(p));
    publish(`cliente:${p.cliente_id}`, 'pedido.atualizado', view(p));
  }
  const hist = (p, status, detalhe) => p.historico.push({ status, detalhe: detalhe ?? null, criado_em: nowIso() });

  function criarPedido(cli, b) {
    const e = S.est.find((x) => x.id === b.estabelecimento_id && x.ativo); if (!e) throw new Err(404, 'Estabelecimento não encontrado');
    const tipo = b.tipo_entrega; if (!['entrega', 'retirada'].includes(tipo)) throw bad('Tipo de entrega inválido');
    const forma = b.forma_pagamento; if (!FORMAS[forma]) throw bad('Forma de pagamento inválida');
    if (!Array.isArray(b.itens) || !b.itens.length) throw bad('O carrinho está vazio');
    if (!statusFunc(e).aberto) throw new Err(409, 'Este estabelecimento está fechado no momento', 'FECHADO');
    if (tipo === 'retirada' && !e.aceita_retirada) throw bad('Este estabelecimento não oferece retirada');
    let end = null;
    if (tipo === 'entrega') { end = S.enderecos.find((x) => x.id === b.endereco_id && x.cliente_id === cli.id); if (!end) throw bad('Endereço inválido'); }
    let subtotal = 0; const itens = [];
    for (const it of b.itens) {
      const pr = S.prods.find((x) => x.id === it.produto_id && x.est === e.id && x.ativo); if (!pr) throw bad('Um dos produtos não está mais disponível');
      const qtd = int(it.quantidade, 'Quantidade', { min: 1, max: 50 });
      const ids = new Set(it.opcoes || []); if (ids.size !== (it.opcoes || []).length) throw bad('Opções repetidas');
      const cont = new Map(), esc = [];
      for (const oid of ids) {
        const g = pr.grupos.find((gg) => gg.opcoes.some((o) => o.id === oid && o.ativo)); if (!g) throw bad('Opção inválida para o produto');
        cont.set(g.id, (cont.get(g.id) || 0) + 1); esc.push({ g, o: g.opcoes.find((o) => o.id === oid) });
      }
      for (const g of pr.grupos) { const n = cont.get(g.id) || 0; if (n < g.minimo) throw bad(`Escolha ao menos ${g.minimo} em "${g.titulo}" (${pr.nome})`); if (n > g.maximo) throw bad(`Escolha no máximo ${g.maximo} em "${g.titulo}" (${pr.nome})`); }
      const unit = pr.preco + esc.reduce((s, x) => s + x.o.preco_adicional, 0), total = unit * qtd; subtotal += total;
      itens.push({ id: nid(), nome: pr.nome, preco_unit: unit, quantidade: qtd, observacao: it.observacao || null, total, opcoes: esc.map((x) => ({ grupo: x.g.titulo, nome: x.o.nome, preco_adicional: x.o.preco_adicional })) });
    }
    if (subtotal < e.pedido_minimo) throw new Err(422, `Pedido mínimo de R$ ${(e.pedido_minimo / 100).toFixed(2).replace('.', ',')}`, 'MINIMO');
    const taxa = tipo === 'entrega' ? e.taxa_entrega : 0, total = subtotal + taxa;
    let troco = null; if (forma === 'dinheiro' && b.troco_para != null) { troco = int(b.troco_para, 'Troco para', { min: 1 }); if (troco < total) throw bad('O valor do troco deve ser maior ou igual ao total'); }
    const online = FORMAS[forma].online, cod = codigo(), t = nowIso();
    const p = { id: nid(), codigo: cod, est: e.id, cliente_id: cli.id, status: online ? 'aguardando_pagamento' : 'novo', tipo_entrega: tipo, cliente_nome: cli.nome, cliente_telefone: cli.telefone || '11999990000',
      endereco: end ? { apelido: end.apelido, rua: end.rua, numero: end.numero, complemento: end.complemento, bairro: end.bairro, cidade: end.cidade, uf: end.uf, cep: end.cep, referencia: end.referencia } : null,
      subtotal, taxa_entrega: taxa, total, forma, pagamento_status: online ? 'pendente' : 'na_entrega', troco_para: troco, observacao: b.observacao || null, motivo: null,
      pix_payload: online ? `TESTE-PIX|pedido=${cod}|valor=${(total / 100).toFixed(2)}` : null, publicado_em: online ? null : t, criado_em: t, atualizado_em: t, itens, historico: [] };
    hist(p, p.status, 'Pedido criado'); S.pedidos.push(p); notificar(p, 'pedido.novo'); return p;
  }
  function confirmarPagamento(p) {
    if (p.pagamento_status === 'pago') return p;
    if (p.status !== 'aguardando_pagamento') throw new Err(409, 'Este pedido não aguarda pagamento');
    p.pagamento_status = 'pago'; p.status = 'novo'; p.publicado_em = p.atualizado_em = nowIso(); hist(p, 'novo', 'Pagamento confirmado'); notificar(p, 'pedido.novo'); return p;
  }
  function mudarStatus(estId, id, novo, motivoRaw, u) {
    const p = S.pedidos.find((x) => x.id === id && x.est === estId && x.publicado_em); if (!p) throw new Err(404, 'Pedido não encontrado');
    const ok = (TRANS[p.status] || []).filter((s) => p.status !== 'pronto' || (p.tipo_entrega === 'entrega' ? s !== 'entregue' : s !== 'em_entrega'));
    if (!ok.includes(novo)) throw new Err(409, `Não é possível mudar de "${STATUS_LABEL[p.status]}" para "${STATUS_LABEL[novo] || novo}"`);
    const motivo = ['recusado', 'cancelado'].includes(novo) ? str(motivoRaw, 'Motivo', { min: 3, max: 200 }) : null;
    p.status = novo; p.atualizado_em = nowIso(); if (motivo) p.motivo = motivo;
    if (novo === 'entregue' && p.pagamento_status === 'na_entrega') p.pagamento_status = 'pago';
    if (motivo) p.pagamento_status = p.pagamento_status === 'pago' ? 'estornar' : 'cancelado';
    hist(p, novo, motivo); audit(u, 'pedido.status', `${p.codigo} -> ${novo}`); notificar(p); return p;
  }

  // ---------- rotas ----------
  const routes = [];
  const R = (method, re, auth, fn) => routes.push({ method, re: new RegExp('^' + re.replace(/:([a-z_]+)/g, '([^/]+)') + '/?$'), auth, fn });
  const userFor = (area) => { const u = S.users.find((x) => x.id === sessions[area] && x.tipo === area && x.ativo); return u || null; };
  const estDe = (u) => S.est.find((e) => e.id === u.est);
  const pubUser = (u) => ({ id: u.id, tipo: u.tipo, nome: u.nome, email: u.email, telefone: u.telefone, estabelecimento_id: u.est });
  const loginArea = (area) => (c) => {

bottom: 0; } .etapas li:last-child::before { display: none; }\n.etapas .bolha { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--linha); flex: none; display: grid; place-items: center; font-size: .8rem; background: var(--papel); z-index: 1; }\n.etapas li.feito { color: var(--tinta); } .etapas li.feito .bolha { background: var(--verde); border-color: var(--verde); color: #fff; }\n.etapas li.feito::before { background: var(--verde); }\n.etapas li.atual { color: var(--tinta); font-weight: 700; } .etapas li.atual .bolha { border-color: var(--uva-2); background: var(--uva-2); color: #fff; animation: pulso 1.6s ease-in-out infinite; }\n@keyframes pulso { 50% { box-shadow: 0 0 0 7px rgba(91,42,140,.2); } }\n@media (prefers-reduced-motion: reduce) { .etapas li.atual .bolha { animation: none; } html { scroll-behavior: auto; } * { transition: none !important; } }\n.pix { word-break: break-all; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; background: var(--fundo); padding: 12px; border-radius: 10px; border: 1px dashed var(--linha); margin: 10px 0; }\n.status-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: .8rem; background: var(--uva-claro); color: var(--uva-2); }\n.status-pill.ruim { background: #f3e1e3; color: #9b1c2b; } .status-pill.bom { background: #dff5e8; color: #14693a; }\n.toasts { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 80; pointer-events: none; padding: 0 12px; }\n.toast { background: var(--uva); color: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.3); font-weight: 600; max-width: 420px; }\n.rod { text-align: center; color: var(--tinta-2); font-size: .85rem; padding: 24px 16px 40px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"topo\" id=\"topo\">\u003c/header>\n  \u003cmain id=\"app\" tabindex=\"-1\" aria-live=\"polite\">\u003c/main>\n  \u003cdiv id=\"modal-root\">\u003c/div>\n  \u003cdiv id=\"toasts\" class=\"toasts\" role=\"status\" aria-live=\"polite\">\u003c/div>\n  \u003cscript>/* Dentro de cada site (iframe): troca fetch e EventSource pelo servidor simulado da página. O código do site não muda. */\n(() => {\n  const demo = () => window.parent.__demo;\n  window.fetch = (url, opts = {}) => new Promise((resolve) => {\n    const u = new URL(url, 'http://demo.local');\n    let body = {}; try { body = opts.body ? JSON.parse(opts.body) : {}; } catch { /* corpo vazio */ }\n    setTimeout(() => {\n      const r = demo().handle((opts.method || 'GET').toUpperCase(), u.pathname, Object.fromEntries(u.searchParams), body);\n      resolve(new Response(JSON.stringify(r.json), { status: r.status, headers: { 'Content-Type': 'application/json' } }));\n    }, 80);\n  });\n  // Num iframe com srcdoc, \"#/rota\" seria resolvido contra a página de fora e recarregaria tudo: trata só o trecho após \"#\".\n  document.addEventListener('click', (e) => {\n    const a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;\n    e.preventDefault();\n    const h = a.getAttribute('href');\n    if (location.hash === h) window.dispatchEvent(new HashChangeEvent('hashchange')); else location.hash = h;\n  }, true);\n  window.EventSource = class {\n    constructor(url) {\n      this.l = {};\n      const area = String(url).includes('/vendedor/') ? 'vendedor' : 'cliente';\n      this.off = demo().subscribe(area, (ev, data) => this._emit(ev, data));\n      setTimeout(() => (this.off ? this._emit('conectado', {}) : this.onerror && this.onerror()), 40);\n    }\n    addEventListener(name, fn) { (this.l[name] = this.l[name] || []).push(fn); }\n    _emit(name, data) { (this.l[name] || []).forEach((fn) => fn({ data: JSON.stringify(data) })); }\n    close() { if (this.off) this.off(); }\n  };\n})();\n\nwindow.APP_CONFIG = { API_URL: 'http://demo.local' };\u003c/script>\n  \u003cscript>/* Site do CLIENTE. Não contém nenhuma tela, rota ou chamada de administração. */\n(() => {\n  'use strict';\n  const API = window.APP_CONFIG.API_URL;\n  const $app = document.getElementById('app');\n  const $topo = document.getElementById('topo');\n  const $modal = document.getElementById('modal-root');\n\n  // ---------- utilitários ----------\n  const esc = (s) => String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const brl = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n  const safeUrl = (u) => (/^https?:\\/\\//i.test(u || '') ? u : '');\n  const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];\n  const store = {\n    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },\n    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sem armazenamento */ } },\n  };\n\n  async function api(method, path, body) {\n    let res;\n    try {\n      res = await fetch(API + path, { method, credentials: 'include', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });\n    } catch { throw Object.assign(new Error('Sem conexão com o servidor. Verifique sua internet e tente de novo.'), { status: 0 }); }\n    const json = await res.json().catch(() => ({}));\n    if (!res.ok) throw Object.assign(new Error(json.erro || 'Algo deu errado. Tente novamente.'), { status: res.status, codigo: json.codigo });\n    return json;\n  }\n\n  function toast(msg) {\n    const el = document.createElement('div');\n    el.className = 'toast'; el.textContent = msg;\n    document.getElementById('toasts').append(el);\n    setTimeout(() => el.remove(), 4500);\n  }\n\n  // ---------- estado ----------\n  let user = null;\n  let cart = store.get('cart', null); // { slug, estId, estNome, itens: [...] }\n  const saveCart = () => { store.set('cart', cart && cart.itens.length ? cart : null); if (!cart?.itens.length) cart = null; renderTopo(); };\n  const cartCount = () => (cart ? cart.itens.reduce((s, i) => s + i.quantidade, 0) : 0);\n  const cartSubtotal = () => (cart ? cart.itens.reduce((s, i) => s + i.preco_unit * i.quantidade, 0) : 0);\n\n  // ---------- topo ----------\n  function renderTopo() {\n    $topo.innerHTML = `\u003cdiv class=\"topo-in\">\n      \u003ca class=\"marca\" href=\"#/\">\u003ci>\u003c/i>Delivery\u003c/a>\n      \u003cnav aria-label=\"Principal\">\n        ${user ? `\u003ca class=\"nav\" href=\"#/pedidos\">Meus pedidos\u003c/a>\u003ca class=\"nav\" href=\"#/perfil\">${esc(user.nome.split(' ')[0])}\u003c/a>`\n               : `\u003ca class=\"nav\" href=\"#/entrar\">Entrar\u003c/a>`}\n        \u003ca class=\"nav carrinho\" href=\"#/carrinho\" aria-label=\"Carrinho, ${cartCount()} itens\">Carrinho\u003cb>${cartCount()}\u003c/b>\u003c/a>\n      \u003c/nav>\u003c/div>`;\n  }\n\n  // ---------- tempo real (somente os pedidos deste cliente) ----------\n  let es = null;\n  const pedidoListeners = new Set();\n  function conectarEventos() {\n    if (es || !user) return;\n    es = new EventSource(API + '/cliente/eventos', { withCredentials: true });\n    es.addEventListener('pedido.atualizado', (e) => {\n      const p = JSON.parse(e.data);\n      pedidoListeners.forEach((fn) => fn(p));\n      toast(`Pedido ${p.codigo}: ${p.status_label}`);\n    });\n  }\n  function desconectarEventos() { if (es) es.close(); es = null; }\n\n  // ---------- roteador ----------\n  const rotas = [\n    [/^#\\/?$/, home], [/^#\\/loja\\/([\\w-]+)$/, loja], [/^#\\/carrinho$/, carrinho], [/^#\\/checkout$/, checkout],\n    [/^#\\/entrar$/, entrar], [/^#\\/pedidos$/, pedidos], [/^#\\/pedido\\/(\\d+)$/, pedido], [/^#\\/perfil$/, perfil],\n  ];\n  async function rotear() {\n    pedidoListeners.clear();\n    closeModal();\n    const hash = location.hash.split('?')[0] || '#/';\n    for (const [re, fn] of rotas) {\n      const m = re.exec(hash);\n      if (m) {\n        try { await fn(...m.slice(1)); } catch (e) { $app.innerHTML = `\u003cdiv class=\"wrap\">\u003cdiv class=\"vazio\">\u003cb>Não foi possível carregar\u003c/b>${esc(e.message)}\u003cp>\u003cbutton class=\"btn\" data-act=\"recarregar\">Tentar de novo\u003c/button>\u003c/p>\u003c/div>\u003c/div>`; }\n        window.scrollTo(0, 0);\n        return;\n      }\n    }\n    $app.innerHTML = `\u003cdiv class=\"wrap\">\u003cdiv class=\"vazio\">\u003cb>Página não encontrada\u003c/b>\u003ca class=\"btn\" href=\"#/\">Ir para o início\u003c/a>\u003c/div>\u003c/div>`;\n  }\n  const exigeLogin = () => { if (user) return false; store.set('next', location.hash); location.hash = '#/entrar'; return true; };\n\n  // ---------- início ----------\n  async function home() {\n    let q = '', cat = '';\n    const carregar = async () => {\n      const data = await api('GET', `/public/estabelecimentos?q=${encodeURIComponent(q)}&categoria=${encodeURIComponent(cat)}`);\n      const lista = document.getElementById('lista');\n      if (!lista || !document.getElementById('chips')) return; // o cliente saiu da página antes da resposta chegar\n      document.getElementById('chips').innerHTML =[['', 'Todos'], ...data.categorias.map((c) => [c, c])]\n        .map(([v, t]) => `\u003cbutton class=\"chip\" data-cat=\"${esc(v)}\" aria-pressed=\"${cat === v}\">${esc(t)}\u003c/button>`).join('');\n      lista.innerHTML = data.estabelecimentos.length ? data.estabelecimentos.map(cardLoja).join('')\n        : `\u003cdiv class=\"vazio\" style=\"grid-column:1/-1\">\u003cb>Nada encontrado\u003c/b>Tente outro nome, categoria ou produto.\u003c/div>`;\n    };\n    $app.innerHTML = `\u003csection class=\"hero\">\u003cdiv class=\"hero-in\">\n        \u003ch1>Pediu, chegou, \u003cem>gelou!\u003c/em>\u003c/h1>\n        \u003cp>Escolha o estabelecimento, monte o pedido do seu jeito e acompanhe cada etapa até a sua porta.\u003c/p>\n        \u003cform class=\"busca\" id=\"busca\" role=\"search\">\u003clabel class=\"sr\" for=\"q\">Buscar estabelecimentos ou produtos\u003c/label>\n          \u003cinput id=\"q\" type=\"search\" placeholder=\"Busque por loja ou produto: açaí, pizza…\" autocomplete=\"off\">\u003cbutton>Buscar\u003c/button>\u003c/form>\n      \u003c/div>\u003c/section>\n      \u003cdiv class=\"wrap\">\u003cdiv class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Categorias\">\u003c/div>\n      \u003ch2 class=\"titulo\">Estabelecimentos\u003c/h2>\u003cdiv class=\"lojas\" id=\"lista\">\u003c/div>\u003c/div>`;\n    document.getElementById('busca').onsubmit = (e) => { e.preventDefault(); q = document.getElementById('q').value.trim(); carregar(); };\n    document.getElementById('chips').onclick = (e) => { const b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; carregar(); } };\n    await carregar();\n  }\n  function statusTexto(s) {\n    if (s.aberto) return '\u003cspan class=\"sel aberto\">Aberto\u003c/span>';\n    if (s.abre_as) return `\u003cspan class=\"sel fechado\">Fechado · abre ${s.abre_hoje ? 'às' : DIAS[s.abre_dia] + ' às'} ${esc(s.abre_as)}\u003c/span>`;\n    return '\u003cspan class=\"sel fechado\">Fechado no momento\u003c/span>';\n  }\n  const logoHtml = (e) => (safeUrl(e.logo_url) ? `\u003cimg class=\"logo\" src=\"${esc(e.logo_url)}\" alt=\"\">` : `\u003cdiv class=\"logo\" aria-hidden=\"true\">${esc(e.nome[0])}\u003c/div>`);\n  const cardLoja = (e) => `\u003ca class=\"loja-card ${e.status.aberto ? '' : 'fechada'}\" href=\"#/loja/${esc(e.slug)}\">${logoHtml(e)}\n      \u003cdiv>\u003ch3>${esc(e.nome)}\u003c/h3>\u003cdiv class=\"meta\">${esc(e.categoria)} · ${e.tempo_min}–${e.tempo_max} min · ${e.taxa_entrega ? brl(e.taxa_entrega) : 'Entrega grátis'}\u003c/div>${statusTexto(e.status)}\u003c/div>\u003c/a>`;\n\n  // ---------- loja e cardápio ----------\n  async function loja(slug) {\n    const data = await api('GET', `/public/estabelecimentos/${encodeURIComponent(slug)}`);\n    const e = data.estabelecimento;\n    document.title = `${e.nome} – Delivery`;\n    const render = (filtro = '') => {\n      const f = filtro.toLowerCase();\n      const cats = data.categorias.map((c) => ({ ...c, produtos: c.produtos.filter((p) => !f || p.nome.toLowerCase().includes(f) || p.descricao.toLowerCase().includes(f)) })).filter((c) => c.produtos.length);\n      document.getElementById('cardapio').innerHTML = cats.length ? cats.map((c) => `\u003ch2 class=\"titulo\" id=\"c${c.id}\">${esc(c.nome)}\u003c/h2>\u003cdiv class=\"produtos\">${c.produtos.map(cardProduto).join('')}\u003c/div>`).join('')\n        : `\u003cdiv class=\"vazio\">\u003cb>Nenhum item encontrado\u003c/b>Tente buscar por outro nome.\u003c/div>`;\n    };\n    const cardProduto = (p) => `\u003cbutton class=\"prod\" data-prod=\"${p.id}\">\u003cdiv class=\"col\">\u003cdiv>\u003ch3>${esc(p.nome)}\u003c/h3>\u003cp>${esc(p.descricao)}\u003c/p>${p.restrito_18 ? '\u003cspan class=\"r18\">Venda proibida para menores de 18 anos\u003c/span>' : ''}\u003c/div>\n        \u003cdiv class=\"preco ${p.preco_original ? '' : 'normal'}\">${p.grupos.some((g) => g.minimo > 0) && !p.preco_original ? 'A partir de ' : ''}${brl(p.preco)}${p.preco_original ? `\u003cs>${brl(p.preco_original)}\u003c/s>` : ''}\u003c/div>\u003c/div>\n        ${safeUrl(p.imagem_url) ? `\u003cimg src=\"${esc(p.imagem_url)}\" alt=\"\" loading=\"lazy\">` : `\u003cdiv class=\"ph\" aria-hidden=\"true\">${esc(p.nome[0])}\u003c/div>`}\u003c/button>`;\n\n    $app.innerHTML = `\u003cdiv class=\"loja-cab\">\u003cdiv class=\"in\">${logoHtml(e)}\u003cdiv>\u003ch1>${esc(e.nome)}\u003c/h1>\n        \u003cdiv class=\"meta\">${esc(e.categoria)} · ${e.tempo_min}–${e.tempo_max} min · ${e.taxa_entrega ? 'Taxa ' + brl(e.taxa_entrega) : 'Entrega grátis'} · Pedido mínimo ${brl(e.pedido_minimo)}\u003c/div>${statusTexto(e.status)}\u003c/div>\u003c/div>\u003c/div>\n      ${e.status.aberto ? '' : `\u003cdiv class=\"aviso\">\u003cdiv>Loja fechada${e.status.abre_as ? ` · abre ${e.status.abre_hoje ? 'hoje' : DIAS[e.status.abre_dia]} às ${esc(e.status.abre_as)}` : ''}. Você pode ver o cardápio, mas só consegue pedir quando ela abrir.\u003c/div>\u003c/div>`}\n      \u003cdiv class=\"wrap\">\u003cdiv class=\"cat-nav\">\u003clabel class=\"sr\" for=\"mq\">Buscar no cardápio\u003c/label>\u003cinput id=\"mq\" class=\"menu-busca\" type=\"search\" placeholder=\"Buscar no cardápio\">\u003c/div>\u003cdiv id=\"cardapio\">\u003c/div>\u003c/div>`;\n    render();\n    document.getElementById('mq').oninput = (ev) => render(ev.target.value.trim());\n    $app.onclick = (ev) => {\n      const b = ev.target.closest('[data-prod]');\n      if (!b) return;\n      const prod = data.categorias.flatMap((c) => c.produtos).find((p) => p.id === Number(b.dataset.prod));\n      abrirProduto(prod, e);\n    };\n  }\n\n  // ---------- modal de produto ----------\n  function closeModal() { $modal.innerHTML = ''; document.body.style.overflow = ''; }\n  function abrirProduto(p, est) {\n    const sel = new Map(p.grupos.map((g) => [g.id, new Set()]));\n    let qtd = 1;\n    const unit = () => p.preco + p.grupos.reduce((s, g) => s + g.opcoes.filter((o) => sel.get(g.id).has(o.id)).reduce((a, o) => a + o.preco_adicional, 0), 0);\n    const okGrupos = () => p.grupos.every((g) => sel.get(g.id).size >= g.minimo);\n    const aberto = est.status.aberto;\n    const draw = () => {\n      const obs = document.getElementById('obs')?.value || '';\n      $modal.innerHTML = `\u003cdiv class=\"overlay\" data-fechar>\u003cdiv class=\"modal ${safeUrl(p.imagem_url) ? '' : 'sem-foto'}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${esc(p.nome)}\">\n        \u003cbutton class=\"fechar\" data-fechar aria-label=\"Fechar\">✕\u003c/button>\n        \u003cdiv class=\"foto\">${safeUrl(p.imagem_url) ? `\u003cimg src=\"${esc(p.imagem_url)}\" alt=\"\">` : ''}\u003c/div>\n        \u003cdiv class=\"corpo\">\u003cdiv class=\"rolagem\">\u003ch2>${esc(p.nome)}\u003c/h2>\u003cp class=\"meta\">${esc(p.descricao)}\u003c/p>\n          \u003cdiv class=\"preco ${p.preco_original ? '' : 'normal'}\">${brl(p.preco)}${p.preco_original ? `\u003cs>${brl(p.preco_original)}\u003c/s>` : ''}\u003c/div>\n          ${p.grupos.map((g) => { const n = sel.get(g.id).size; return `\u003cdiv class=\"grupo-t\">\u003cdiv>\u003cb>${esc(g.titulo)}\u003c/b>\u003csmall>${g.maximo === 1 ? 'Escolha 1 opção' : `Escolha até ${g.maximo} opções`}\u003c/small>\u003c/div>\n            ${g.minimo > 0 ? `\u003cspan class=\"badge ${n >= g.minimo ? 'ok' : ''}\">${n}/${g.maximo} · obrigatório\u003c/span>` : `\u003cspan class=\"badge\">${n}/${g.maximo}\u003c/span>`}\u003c/div>\n            ${g.opcoes.map((o) => `\u003cdiv class=\"opcao ${g.maximo > 1 ? 'multi' : ''}\" role=\"${g.maximo > 1 ? 'checkbox' : 'radio'}\" tabindex=\"0\" aria-checked=\"${sel.get(g.id).has(o.id)}\" data-g=\"${g.id}\" data-o=\"${o.id}\">\n              \u003cdiv class=\"t\">${esc(o.nome)}${o.preco_adicional ? ` \u003cspan class=\"mais\">+ ${brl(o.preco_adicional)}\u003c/span>` : ''}\u003c/div>${safeUrl(o.imagem_url) ? `\u003cimg src=\"${esc(o.imagem_url)}\" alt=\"\">` : ''}\u003cspan class=\"marca-op\">✓\u003c/span>\u003c/div>`).join('')}`; }).join('')}\n          \u003cdiv class=\"grupo-t\">\u003cdiv>\u003cb>Algum comentário?\u003c/b>\u003c/div>\u003csmall id=\"cont\">0 / 140\u003c/small>\u003c/div>\n          \u003ctextarea id=\"obs\" maxlength=\"140\" placeholder=\"Ex.: sem granola, calda à parte…\">${esc(obs)}\u003c/textarea>\n        \u003c/div>\u003cdiv class=\"rodape\">\u003cdiv class=\"qtd\">\u003cbutton data-q=\"-1\" aria-label=\"Menos\">−\u003c/button>\u003cspan aria-live=\"polite\">${qtd}\u003c/span>\u003cbutton data-q=\"1\" aria-label=\"Mais\">+\u003c/button>\u003c/div>\n          \u003cbutton class=\"btn\" id=\"add\" ${okGrupos() && aberto ? '' : 'disabled'}>\u003cspan>${aberto ? 'Adicionar' : 'Loja fechada'}\u003c/span>\u003cspan>${brl(unit() * qtd)}\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>`;\n      document.body.style.overflow = 'hidden';\n      const ta = document.getElementById('obs'); document.getElementById('cont').textContent = `${ta.value.length} / 140`;\n      ta.oninput = () => { document.getElementById('cont').textContent = `${ta.value.length} / 140`; };\n    };\n    draw();\n    const toggle = (gid, oid) => {\n      const g = p.grupos.find((x) => x.id === gid), s = sel.get(gid);\n      if (s.has(oid)) s.delete(oid);\n      else if (g.maximo === 1) { s.clear(); s.add(oid); }\n      else if (s.size \u003c g.maximo) s.add(oid);\n      else return toast(`Você já escolheu ${g.maximo} em \"${g.titulo}\"`);\n      const scroll = document.querySelector('.rolagem').scrollTop; draw(); document.querySelector('.rolagem').scrollTop = scroll;\n    };\n    $modal.onclick = (ev) => {\n      if (ev.target.closest('[data-fechar]') && (ev.target.classList.contains('overlay') || ev.target.classList.contains('fechar'))) return closeModal();\n      const op = ev.target.closest('.opcao'); if (op) return toggle(Number(op.dataset.g), Number(op.dataset.o));\n      const q = ev.target.closest('[data-q]'); if (q) { qtd = Math.min(50, Math.max(1, qtd + Number(q.dataset.q))); const sc = document.querySelector('.rolagem').scrollTop; draw(); document.querySelector('.rolagem').scrollTop = sc; return; }\n      if (ev.target.closest('#add') && !document.getElementById('add').disabled) {\n        if (cart && cart.estId !== est.id && !confirm(`Seu carrinho tem itens de ${cart.estNome}. Deseja esvaziá-lo e começar um pedido em ${est.nome}?`)) return;\n        if (!cart || cart.estId !== est.id) cart = { slug: est.slug, estId: est.id, estNome: est.nome, itens: [] };\n        const opcoes = p.grupos.flatMap((g) => g.opcoes.filter((o) => sel.get(g.id).has(o.id)).map((o) => ({ id: o.id, nome: o.nome, preco_adicional: o.preco_adicional })));\n        const observacao = document.getElementById('obs').value.trim();\n        const key = [p.id, opcoes.map((o) => o.id).sort().join('.'), observacao].join('|');\n        const ex = cart.itens.find((i) => i.key === key);\n        if (ex) ex.quantidade = Math.min(50, ex.quantidade + qtd);\n        else cart.itens.push({ key, produto_id: p.id, nome: p.nome, preco_unit: unit(), quantidade: qtd, opcoes, observacao });\n        saveCart(); closeModal(); toast('Adicionado ao carrinho');\n      }\n    };\n    $modal.onkeydown = (ev) => {\n      if (ev.key === 'Escape') closeModal();\n      const op = ev.target.closest?.('.opcao'); if (op && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); toggle(Number(op.dataset.g), Number(op.dataset.o)); document.querySelector(`[data-g=\"${op.dataset.g}\"][data-o=\"${op.dataset.o}\"]`)?.focus(); }\n    };\n  }\n\n  // ---------- carrinho ----------\n  async function carrinho() {\n    if (!cart) { $app.innerHTML = `\u003cdiv class=\"wrap\">\u003cdiv class=\"vazio\">\u003cb>Seu carrinho está vazio\u003c/b>Escolha um estabelecimento e adicione itens.\u003cp>\u003ca class=\"btn\" href=\"#/\">Ver estabelecimentos\u003c/a>\u003c/p>\u003c/div>\u003c/div>`; return; }\n    $app.innerHTML = `\u003cdiv class=\"wrap\">\u003ch2 class=\"titulo\">Seu pedido em ${esc(cart.estNome)}\u003c/h2>\u003cdiv class=\"duas\">\u003cdiv class=\"painel\">\n      ${cart.itens.map((i, idx) => `\u003cdiv class=\"item-c\">\u003cdiv class=\"t\">\u003cb>${esc(i.nome)}\u003c/b>${i.opcoes.map((o) => `\u003csmall>${esc(o.nome)}${o.preco_adicional ? ' + ' + brl(o.preco_adicional) : ''}\u003c/small>`).join('')}${i.observacao ? `\u003csmall>Obs.: ${esc(i.observacao)}\u003c/small>` : ''}\n        \u003cdiv class=\"qtd\" style=\"display:inline-flex;margin-top:8px\">\u003cbutton data-ci=\"${idx}\" data-d=\"-1\" aria-label=\"Menos\">−\u003c/button>\u003cspan>${i.quantidade}\u003c/span>\u003cbutton data-ci=\"${idx}\" data-d=\"1\" aria-label=\"Mais\">+\u003c/button>\u003c/div>\n        \u003cbutton class=\"chip\" data-rm=\"${idx}\" style=\"margin-left:8px\">Remover\u003c/button>\u003c/div>\u003cb>${brl(i.preco_unit * i.quantidade)}\u003c/b>\u003c/div>`).join('')}\n      \u003cp>\u003ca href=\"#/loja/${esc(cart.slug)}\">+ Adicionar mais itens\u003c/a>\u003c/p>\u003c/div>\n      \u003cdiv class=\"painel\">\u003ch2>Resumo\u003c/h2>\u003cdiv class=\"linha\">\u003cspan>Subtotal\u003c/span>\u003cb>${brl(cartSubtotal())}\u003c/b>\u003c/div>\u003cdiv class=\"linha total\">\u003cspan>Total parcial\u003c/span>\u003cspan>${brl(cartSubtotal())}\u003c/span>\u003c/div>\n      \u003cp class=\"meta\">Taxa de entrega e forma de pagamento são definidas na próxima etapa.\u003c/p>\u003ca class=\"btn lima\" href=\"#/checkout\" style=\"width:100%;justify-content:center\">Continuar para o pagamento\u003c/a>\u003c/div>\u003c/div>\u003c/div>`;\n    $app.onclick = (ev) => {\n      const m = ev.target.closest('[data-ci]'), r = ev.target.closest('[data-rm]');\n      if (m) { const it = cart.itens[Number(m.dataset.ci)]; it.quantidade = Math.min(50, Math.max(1, it.quantidade + Number(m.dataset.d))); saveCart(); carrinho(); }\n      if (r) { cart.itens.splice(Number(r.dataset.rm), 1); saveCart(); carrinho(); }\n    };\n  }\n\n  // ---------- checkout ----------\n  async function checkout() {\n    if (exigeLogin()) return;\n    if (!cart) { location.hash = '#/carrinho'; return; }\n    const [{ estabelecimento: est, formas_pagamento }, { enderecos }] = await Promise.all([api('GET', `/public/estabelecimentos/${encodeURIComponent(cart.slug)}`), api('GET', '/cliente/enderecos')]);\n    let tipo = 'entrega', forma = formas_pagamento[0].id, endId = enderecos[0]?.id || null;\n    const taxa = () => (tipo === 'entrega' ? est.taxa_entrega : 0);\n    const draw = () => {\n      const erro = document.getElementById('erro')?.innerHTML || '';\n      const eh = est.aceita_retirada;\n      $app.innerHTML = `\u003cdiv class=\"wrap\">\u003ch2 class=\"titulo\">Finalizar pedido\u003c/h2>\u003cdiv class=\"duas\">\u003cdiv>\n        \u003cdiv class=\"painel\">\u003ch2>Como você quer receber?\u003c/h2>\n          \u003clabel class=\"escolha\">\u003cinput type=\"radio\" name=\"tipo\" value=\"entrega\" ${tipo === 'entrega' ? 'checked' : ''}>\u003cspan>\u003cb>Entrega\u003c/b>\u003cbr>\u003csmall class=\"meta\">${est.tempo_min}–${est.tempo_max} min · ${est.taxa_entrega ? brl(est.taxa_entrega) : 'grátis'}\u003c/small>\u003c/span>\u003c/label>\n          ${eh ? `\u003clabel class=\"escolha\">\u003cinput type=\"radio\" name=\"tipo\" value=\"retirada\" ${tipo === 'retirada' ? 'checked' : ''}>\u003cspan>\u003cb>Retirar no local\u003c/b>\u003cbr>\u003csmall class=\"meta\">${esc(est.endereco || 'Endereço informado pela loja')}\u003c/small>\u003c/span>\u003c/label>` : ''}\u003c/div>\n        ${tipo === 'entrega' ? `\u003cdiv class=\"painel\">\u003ch2>Endereço de entrega\u003c/h2>${enderecos.map((a) => `\u003clabel class=\"escolha\">\u003cinput type=\"radio\" name=\"end\" value=\"${a.id}\" ${a.id === endId ? 'checked' : ''}>\u003cspan>\u003cb>${esc(a.apelido)}\u003c/b>\u003cbr>${esc(a.rua)}, ${esc(a.numero)}${a.complemento ? ' – ' + esc(a.complemento) : ''}\u003cbr>\u003csmall class=\"meta\">${esc(a.bairro)} · ${esc(a.cidade)}\u003c/small>\u003c/span>\u003c/label>`).join('')}\n          \u003cdetails ${enderecos.length ? '' : 'open'}>\u003csummary>\u003cb>Adicionar novo endereço\u003c/b>\u003c/summary>\u003cform id=\"fend\" style=\"margin-top:12px\">\n            \u003cdiv class=\"grade2\">\u003clabel class=\"campo\">\u003cspan>Rua\u003c/span>\u003cinput name=\"rua\" required maxlength=\"120\">\u003c/label>\u003clabel class=\"campo\">\u003cspan>Número\u003c/span>\u003cinput name=\"numero\" required maxlength=\"12\">\u003c/label>\u003c/div>\n            \u003cdiv class=\"grade2\">\u003clabel class=\"campo\">\u003cspan>Bairro\u003c/span>\u003cinput name=\"bairro\" required maxlength=\"80\">\u003c/label>\u003clabel class=\"campo\">\u003cspan>Cidade\u003c/span>\u003cinput name=\"cidade\" required maxlength=\"80\">\u003c/label>\u003c/div>\n            \u003cdiv class=\"grade2\">\u003clabel class=\"campo\">\u003cspan>Complemento\u003c/span>\u003cinput name=\"complemento\" maxlength=\"60\">\u003c/label>\u003clabel class=\"campo\">\u003cspan>Referência\u003c/span>\u003cinput name=\"referencia\" maxlength=\"120\">\u003c/label>\u003c/div>\n            \u003cbutton class=\"btn fantasma\" type=\"submit\">Salvar endereço\u003c/button>\u003c/form>\u003c/details>\u003c/div>` : ''}\n        \u003cdiv class=\"painel\">\u003ch2>Pagamento\u003c/h2>${formas_pagamento.map((f) => `\u003clabel class=\"escolha\">\u003cinput type=\"radio\" name=\"forma\" value=\"${f.id}\" ${f.id === forma ? 'checked' : ''}>\u003cspan>\u003cb>${esc(f.label)}\u003c/b>${f.online ? '\u003cbr>\u003csmall class=\"meta\">Pague agora; o pedido segue para a loja assim que for confirmado.\u003c/small>' : ''}\u003c/span>\u003c/label>`).join('')}\n          ${forma === 'dinheiro' ? `\u003clabel class=\"campo\">\u003cspan>Troco para (opcional)\u003c/span>\u003cinput id=\"troco\" inputmode=\"decimal\" placeholder=\"Ex.: 50,00\">\u003c/label>` : ''}\u003c/div>\n        \u003cdiv class=\"painel\">\u003clabel class=\"campo\">\u003cspan>Observação para a loja (opcional)\u003c/span>\u003ctextarea id=\"obsped\" maxlength=\"300\" rows=\"2\">\u003c/textarea>\u003c/label>\u003c/div>\u003c/div>\n        \u003cdiv class=\"painel\">\u003ch2>Resumo\u003c/h2>${cart.itens.map((i) => `\u003cdiv class=\"linha\">\u003cspan>${i.quantidade}× ${esc(i.nome)}\u003c/span>\u003cspan>${brl(i.preco_unit * i.quantidade)}\u003c/span>\u003c/div>`).join('')}\n          \u003cdiv class=\"linha\">\u003cspan>Subtotal\u003c/span>\u003cspan>${brl(cartSubtotal())}\u003c/span>\u003c/div>\u003cdiv class=\"linha\">\u003cspan>Entrega\u003c/span>\u003cspan>${taxa() ? brl(taxa()) : 'Grátis'}\u003c/span>\u003c/div>\n          \u003cdiv class=\"linha total\">\u003cspan>Total\u003c/span>\u003cspan>${brl(cartSubtotal() + taxa())}\u003c/span>\u003c/div>\n          ${cartSubtotal() \u003c est.pedido_minimo ? `\u003cdiv class=\"erro\">Pedido mínimo de ${brl(est.pedido_minimo)}. Adicione mais itens.\u003c/div>` : ''}\n          ${est.status.aberto ? '' : '\u003cdiv class=\"erro\">Esta loja está fechada no momento.\u003c/div>'}\n          \u003cdiv id=\"erro\" aria-live=\"assertive\">${erro}\u003c/div>\n          \u003cbutton class=\"btn lima\" id=\"fin\" style=\"width:100%;justify-content:center\" ${est.status.aberto && cartSubtotal() >= est.pedido_minimo && (tipo === 'retirada' || endId) ? '' : 'disabled'}>Finalizar pedido\u003c/button>\u003c/div>\u003c/div>\u003c/div>`;\n      $app.querySelectorAll('input[name=tipo]').forEach((i) => (i.onchange = () => { tipo = i.value; draw(); }));\n      $app.querySelectorAll('input[name=end]').forEach((i) => (i.onchange = () => { endId = Number(i.value); }));\n      $app.querySelectorAll('input[name=forma]').forEach((i) => (i.onchange = () => { forma = i.value; draw(); }));\n      const fend = document.getElementById('fend');\n      if (fend) fend.onsubmit = async (ev) => {\n        ev.preventDefault();\n        try { const r = await api('POST', '/cliente/enderecos', Object.fromEntries(new FormData(fend))); enderecos.push(r.endereco); endId = r.endereco.id; draw(); }\n        catch (e) { document.getElementById('erro').innerHTML = `\u003cdiv class=\"erro\">${esc(e.message)}\u003c/div>`; }\n      };\n      document.getElementById('fin').onclick = async () => {\n        const btn = document.getElementById('fin'); btn.disabled = true;\n        const trocoTxt = document.getElementById('troco')?.value.trim();\n        const troco = trocoTxt ? Math.round(parseFloat(trocoTxt.replace(/\\./g, '').replace(',', '.')) * 100) : null;\n        try {\n          const r = await api('POST', '/cliente/pedidos', {\n            estabelecimento_id: cart.estId, tipo_entrega: tipo, endereco_id: tipo === 'entrega' ? endId : undefined, forma_pagamento: forma,\n            troco_para: Number.isFinite(troco) ? troco : undefined, observacao: document.getElementById('obsped').value.trim() || undefined,\n            itens: cart.itens.map((i) => ({ produto_id: i.produto_id, quantidade: i.quantidade, observacao: i.observacao || undefined, opcoes: i.opcoes.map((o) => o.id) })),\n          });\n          cart = null; saveCart(); location.hash = `#/pedido/${r.pedido.id}`;\n        } catch (e) {\n          if (e.status === 401) { user = null; renderTopo(); return exigeLogin(); }\n          document.getElementById('erro').innerHTML = `\u003cdiv class=\"erro\">${esc(e.message)}\u003c/div>`; btn.disabled = false;\n        }\n      };\n    };\n    draw();\n  }\n\n  // ---------- acompanhamento ----------\n  const FLUXO = { entrega: [['novo', 'Pedido enviado à loja'], ['preparando', 'Em preparo'], ['pronto', 'Pronto'], ['em_entrega', 'Saiu para entrega'], ['entregue', 'Entregue']],\n    retirada: [['novo', 'Pedido enviado à loja'], ['preparando', 'Em preparo'], ['pronto', 'Pronto para retirada'], ['entregue', 'Retirado']] };\n  function etapasHtml(p) {\n    const fluxo = FLUXO[p.tipo_entrega]; const idx = fluxo.findIndex(([s]) => s === p.status);\n    const feitoAte = p.status === 'entregue' ? fluxo.length : idx;\n    return `\u003col class=\"etapas\">${fluxo.map(([s, t], i) => `\u003cli class=\"${i \u003c feitoAte ? 'feito' : i === feitoAte ? 'atual' : ''}\">\u003cspan class=\"bolha\">${i \u003c feitoAte ? '✓' : ''}\u003c/span>\u003cspan>${esc(t)}\u003c/span>\u003c/li>`).join('')}\u003c/ol>`;\n  }\n  function pedidoHtml(p) {\n    const ruim = ['recusado', 'cancelado'].includes(p.status);\n    return `\u003cdiv class=\"wrap\">\u003cp>\u003ca href=\"#/pedidos\">← Meus pedidos\u003c/a>\u003c/p>\u003ch2 class=\"titulo\">Pedido ${esc(p.codigo)} \u003cspan class=\"status-pill ${ruim ? 'ruim' : p.status === 'entregue' ? 'bom' : ''}\">${esc(p.status_label)}\u003c/span>\u003c/h2>\n      \u003cdiv class=\"duas\">\u003cdiv>\n        ${p.status === 'aguardando_pagamento' ? `\u003cdiv class=\"painel\">\u003ch2>Pague com Pix\u003c/h2>\u003cp>Copie o código abaixo e pague no app do seu banco. O pedido é enviado à loja assim que o pagamento for confirmado.\u003c/p>\u003cdiv class=\"pix\" id=\"pix\">${esc(p.pix_payload)}\u003c/div>\n          \u003cbutton class=\"btn\" data-act=\"copiar\">Copiar código\u003c/button> \u003cbutton class=\"btn fantasma\" data-act=\"cancelar\">Cancelar pedido\u003c/button>\n          ${String(p.pix_payload).startsWith('TESTE-PIX') ? `\u003cp class=\"meta\">Ambiente de testes: \u003cbutton class=\"btn fantasma\" data-act=\"simular\">Simular pagamento\u003c/button>\u003c/p>` : ''}\u003c/div>` : ''}\n        ${ruim ? `\u003cdiv class=\"painel\">\u003cdiv class=\"erro\">${p.status === 'recusado' ? 'A loja não pôde aceitar o pedido' : 'Pedido cancelado'}${p.motivo ? `: ${esc(p.motivo)}` : ''}.${p.pagamento_status === 'estornar' ? ' O valor pago será estornado.' : ''}\u003c/div>\u003c/div>`\n          : p.status === 'aguardando_pagamento' ? '' : `\u003cdiv class=\"painel\">\u003ch2>Acompanhamento\u003c/h2>${etapasHtml(p)}${p.status === 'novo' ? '\u003cp class=\"meta\">Aguardando a loja aceitar o pedido.\u003c/p>' : ''}\n            ${p.status === 'novo' ? '\u003cbutton class=\"btn fantasma\" data-act=\"cancelar\">Cancelar pedido\u003c/button>' : ''}\u003c/div>`}\n        \u003cdiv class=\"painel\">\u003ch2>${p.estabelecimento.nome ? esc(p.estabelecimento.nome) : 'Loja'}\u003c/h2>${p.estabelecimento.telefone ? `\u003cp class=\"meta\">Dúvidas? Fale com a loja: ${esc(p.estabelecimento.telefone)}\u003c/p>` : ''}\n          ${p.itens.map((i) => `\u003cdiv class=\"item-c\">\u003cdiv class=\"t\">\u003cb>${i.quantidade}× ${esc(i.nome)}\u003c/b>${i.opcoes.map((o) => `\u003csmall>${esc(o.nome)}\u003c/small>`).join('')}${i.observacao ? `\u003csmall>Obs.: ${esc(i.observacao)}\u003c/small>` : ''}\u003c/div>\u003cb>${brl(i.total)}\u003c/b>\u003c/div>`).join('')}\u003c/div>\u003c/div>\n      \u003cdiv class=\"painel\">\u003ch2>Pagamento\u003c/h2>\u003cdiv class=\"linha\">\u003cspan>Subtotal\u003c/span>\u003cspan>${brl(p.subtotal)}\u003c/span>\u003c/div>\u003cdiv class=\"linha\">\u003cspan>Entrega\u003c/span>\u003cspan>${p.taxa_entrega ? brl(p.taxa_entrega) : 'Grátis'}\u003c/span>\u003c/div>\n        \u003cdiv class=\"linha total\">\u003cspan>Total\u003c/span>\u003cspan>${brl(p.total)}\u003c/span>\u003c/div>\u003cp class=\"meta\">${esc(p.forma_pagamento_label)} · ${p.pagamento_status === 'pago' ? 'Pago' : p.pagamento_status === 'na_entrega' ? 'Pagar na entrega' : p.pagamento_status === 'pendente' ? 'Aguardando pagamento' : esc(p.pagamento_status)}\u003c/p>\n        ${p.endereco ? `\u003ch2 style=\"margin-top:16px\">Entregar em\u003c/h2>\u003cp class=\"meta\">${esc(p.endereco.rua)}, ${esc(p.endereco.numero)}${p.endereco.complemento ? ' – ' + esc(p.endereco.complemento) : ''}\u003cbr>${esc(p.endereco.bairro)} · ${esc(p.endereco.cidade)}\u003c/p>` : ''}\u003c/div>\u003c/div>\u003c/div>`;\n  }\n  async function pedido(id) {\n    if (exigeLogin()) return;\n    let p = (await api('GET', `/cliente/pedidos/${id}`)).pedido;\n    const draw = () => { $app.innerHTML = pedidoHtml(p); };\n    draw();\n    // Atualiza sozinho quando o vendedor muda o status (SSE), sem recarregar.\n    pedidoListeners.add((novo) => { if (novo.id === p.id) { p = novo; draw(); } });\n    $app.onclick = async (ev) => {\n      const a = ev.target.closest('[data-act]')?.dataset.act; if (!a) return;\n      try {\n        if (a === 'copiar') { await navigator.clipboard?.writeText(p.pix_payload); toast('Código Pix copiado'); }\n        if (a === 'simular') { p = (await api('POST', `/cliente/pedidos/${p.id}/pagamento/simular`)).pedido; draw(); }\n        if (a === 'cancelar' && confirm('Cancelar este pedido?')) { p = (await api('POST', `/cliente/pedidos/${p.id}/cancelar`)).pedido; draw(); }\n      } catch (e) { toast(e.message); }\n    };\n  }\n\n  async function pedidos() {\n    if (exigeLogin()) return;\n    const { pedidos: lista } = await api('GET', '/cliente/pedidos');\n    $app.innerHTML = `\u003cdiv class=\"wrap\">\u003ch2 class=\"titulo\">Meus pedidos\u003c/h2>${lista.length ? lista.map((p) => `\u003ca class=\"painel loja-card\" style=\"display:flex;justify-content:space-between\" href=\"#/pedido/${p.id}\">\n      \u003cdiv>\u003cb>${esc(p.estabelecimento.nome)}\u003c/b>\u003cdiv class=\"meta\">${esc(p.codigo)} · ${new Date(p.criado_em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })} · ${p.itens.reduce((s, i) => s + i.quantidade, 0)} itens\u003c/div>\u003c/div>\n      \u003cdiv style=\"text-align:right\">\u003cb>${brl(p.total)}\u003c/b>\u003cbr>\u003cspan class=\"status-pill ${['recusado', 'cancelado'].includes(p.status) ? 'ruim' : p.status === 'entregue' ? 'bom' : ''}\">${esc(p.status_label)}\u003c/span>\u003c/div>\u003c/a>`).join('')\n      : `\u003cdiv class=\"vazio\">\u003cb>Você ainda não fez pedidos\u003c/b>\u003ca class=\"btn\" href=\"#/\">Ver estabelecimentos\u003c/a>\u003c/div>`}\u003c/div>`;\n    pedidoListeners.add(() => pedidos());\n  }\n\n  // ---------- conta ----------\n  async function entrar() {\n    let modo = 'login';\n    const draw = (erro = '') => {\n      $app.innerHTML = `\u003cdiv class=\"wrap\" style=\"max-width:460px\">\u003ch2 class=\"titulo\">${modo === 'login' ? 'Entrar' : 'Criar conta'}\u003c/h2>\u003cdiv class=\"painel\">\n        ${erro ? `\u003cdiv class=\"erro\">${esc(erro)}\u003c/div>` : ''}\u003cform id=\"f\">\n        ${modo === 'cadastro' ? '\u003clabel class=\"campo\">\u003cspan>Nome\u003c/span>\u003cinput name=\"nome\" required minlength=\"2\" autocomplete=\"name\">\u003c/label>\u003clabel class=\"campo\">\u003cspan>Telefone com DDD\u003c/span>\u003cinput name=\"telefone\" required inputmode=\"tel\" autocomplete=\"tel\" placeholder=\"11 99999-0000\">\u003c/label>' : ''}\n        \u003clabel class=\"campo\">\u003cspan>E-mail\u003c/span>\u003cinput name=\"email\" type=\"email\" required autocomplete=\"email\">\u003c/label>\n        \u003clabel class=\"campo\">\u003cspan>Senha\u003c/span>\u003cinput name=\"senha\" type=\"password\" required minlength=\"${modo === 'cadastro' ? 8 : 1}\" autocomplete=\"${modo === 'login' ? 'current-password' : 'new-password'}\">${modo === 'cadastro' ? '\u003csmall class=\"meta\">Mínimo de 8 caracteres.\u003c/small>' : ''}\u003c/label>\n        \u003cbutton class=\"btn lima\" style=\"width:100%;justify-content:center\">${modo === 'login' ? 'Entrar' : 'Criar conta'}\u003c/button>\u003c/form>\n        \u003cp style=\"text-align:center\">\u003cbutton class=\"btn fantasma\" id=\"troca\">${modo === 'login' ? 'Não tenho conta' : 'Já tenho conta'}\u003c/button>\u003c/p>\u003c/div>\u003c/div>`;\n      document.getElementById('troca').onclick = () => { modo = modo === 'login' ? 'cadastro' : 'login'; draw(); };\n      document.getElementById('f').onsubmit = async (ev) => {\n        ev.preventDefault();\n        try {\n          const r = await api('POST', modo === 'login' ? '/cliente/auth/login' : '/cliente/auth/cadastro', Object.fromEntries(new FormData(ev.target)));\n          user = r.usuario; renderTopo(); conectarEventos();\n          const next = store.get('next', '#/'); store.set('next', null); location.hash = next || '#/';\n        } catch (e) { draw(e.message); }\n      };\n    };\n    if (user) { location.hash = '#/'; return; }\n    draw();\n  }\n\n  async function perfil() {\n    if (exigeLogin()) return;\n    const draw = (msg = '', erro = '') => {\n      $app.innerHTML = `\u003cdiv class=\"wrap\" style=\"max-width:560px\">\u003ch2 class=\"titulo\">Meu perfil\u003c/h2>\u003cdiv class=\"painel\">${msg ? `\u003cp style=\"color:var(--verde);font-weight:700\">${esc(msg)}\u003c/p>` : ''}${erro ? `\u003cdiv class=\"erro\">${esc(erro)}\u003c/div>` : ''}\n        \u003cform id=\"f\">\u003clabel class=\"campo\">\u003cspan>Nome\u003c/span>\u003cinput name=\"nome\" required value=\"${esc(user.nome)}\">\u003c/label>\u003clabel class=\"campo\">\u003cspan>Telefone\u003c/span>\u003cinput name=\"telefone\" value=\"${esc(user.telefone || '')}\">\u003c/label>\n        \u003clabel class=\"campo\">\u003cspan>E-mail\u003c/span>\u003cinput value=\"${esc(user.email)}\" disabled>\u003c/label>\n        \u003cdetails>\u003csummary>\u003cb>Alterar senha\u003c/b>\u003c/summary>\u003clabel class=\"campo\">\u003cspan>Senha atual\u003c/span>\u003cinput name=\"senha_atual\" type=\"password\" autocomplete=\"current-password\">\u003c/label>\u003clabel class=\"campo\">\u003cspan>Nova senha\u003c/span>\u003cinput name=\"senha_nova\" type=\"password\" minlength=\"8\" autocomplete=\"new-password\">\u003c/label>\u003c/details>\n        \u003cp>\u003cbutton class=\"btn\">Salvar alterações\u003c/button>\u003c/p>\u003c/form>\u003chr style=\"border:0;border-top:1px solid var(--linha)\">\u003cp>\u003cbutton class=\"btn fantasma\" id=\"sair\">Sair da conta\u003c/button>\u003c/p>\u003c/div>\u003c/div>`;\n      document.getElementById('sair').onclick = async () => { await api('POST', '/cliente/auth/logout').catch(() => {}); user = null; desconectarEventos(); renderTopo(); location.hash = '#/'; };\n      document.getElementById('f').onsubmit = async (ev) => {\n        ev.preventDefault();\n        const d = Object.fromEntries(new FormData(ev.target)); if (!d.senha_nova) { delete d.senha_nova; delete d.senha_atual; }\n        try { await api('PATCH', '/cliente/perfil', d); user = { ...user, nome: d.nome, telefone: d.telefone || null }; renderTopo(); draw('Alterações salvas'); } catch (e) { draw('', e.message); }\n      };\n    };\n    draw();\n  }\n\n  // ---------- delegação global ----------\n  document.addEventListener('click', (e) => { if (e.target.closest('[data-act=\"recarregar\"]')) rotear(); });\n  window.addEventListener('hashchange', rotear);\n\n  (async function iniciar() {\n    renderTopo();\n    try { user = (await api('GET', '/cliente/auth/me')).usuario; conectarEventos(); } catch { user = null; }\n    renderTopo();\n    rotear();\n  })();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","vendedor":"\u003c!doctype html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"robots\" content=\"noindex, nofollow\">\n  \u003ctitle>Painel do vendedor\u003c/title>\n  \u003cstyle>:root {\n  --bg: #0f1419;\n  --painel: #171e26;\n  --painel-2: #1f2832;\n  --linha: #2b3745;\n  --texto: #e8eef4;\n  --texto-2: #93a3b5;\n  --ambar: #ffb020;\n  --ambar-esc: #3a2a08;\n  --verde: #2ec27e;\n  --verde-esc: #0f3324;\n  --verm: #ff5d6c;\n  --verm-esc: #3b161c;\n  --azul: #4aa8ff;\n  --fonte: \"Segoe UI\", \"SF Pro Text\", system-ui, -apple-system, sans-serif;\n  --mono: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n}\n* { box-sizing: border-box; }\nbody { margin: 0; background: var(--bg); color: var(--texto); font-family: var(--fonte); line-height: 1.4; -webkit-font-smoothing: antialiased; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\na { color: inherit; text-decoration: none; }\n:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; border-radius: 6px; }\n.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }\n\n/* ---------- Estrutura ---------- */\n.app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }\n.lateral { grid-row: 1 / 3; background: var(--painel); border-right: 1px solid var(--linha); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }\n.lateral .nome { font-weight: 800; font-size: 1.05rem; padding: 4px 10px 2px; }\n.lateral .sub { color: var(--texto-2); font-size: .8rem; padding: 0 10px 14px; border-bottom: 1px solid var(--linha); margin-bottom: 8px; }\n.lateral a { padding: 10px 12px; border-radius: 8px; color: var(--texto-2); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }\n.lateral a:hover { background: var(--painel-2); color: var(--texto); }\n.lateral a[aria-current=\"page\"] { background: var(--ambar); color: #1b1203; }\n.lateral .cnt { background: var(--verm); color: #fff; border-radius: 999px; font-size: .78rem; padding: 0 8px; min-width: 22px; text-align: center; }\n.lateral .fim { margin-top: auto; }\n.barra { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--linha); background: var(--painel); flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }\n.barra h1 { margin: 0; font-size: 1.15rem; flex: 1; min-width: 140px; }\n.conexao { font-size: .82rem; color: var(--texto-2); display: flex; align-items: center; gap: 6px; }\n.conexao i { width: 9px; height: 9px; border-radius: 50%; background: var(--verm); display: inline-block; }\n.conexao.on i { background: var(--verde); }\nmain { padding: 20px; min-width: 0; }\n@media (max-width: 860px) {\n  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }\n  .lateral { grid-row: auto; flex-direction: row; overflow-x: auto; height: auto; position: static; padding: 8px; border-right: 0; border-bottom: 1px solid var(--linha); }\n  .lateral .nome, .lateral .sub, .lateral .fim { display: none; }\n  .lateral a { white-space: nowrap; }\n}\n\n/* ---------- Controles ---------- */\n.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--painel-2); border: 1px solid var(--linha); }\n.btn:hover:not(:disabled) { border-color: var(--texto-2); }\n.btn:disabled { opacity: .45; cursor: not-allowed; }\n.btn.prim { background: var(--ambar); color: #1b1203; border-color: var(--ambar); }\n.btn.ok { background: var(--verde); color: #04210f; border-color: var(--verde); }\n.btn.perigo { background: transparent; color: var(--verm); border-color: var(--verm); }\n.btn.peq { padding: 6px 10px; font-size: .85rem; }\n.interruptor { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; }\n.interruptor input { position: absolute; opacity: 0; }\n.interruptor .trilho { width: 46px; height: 26px; border-radius: 999px; background: var(--linha); position: relative; transition: background .15s; }\n.interruptor .trilho::after { content: \"\"; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }\n.interruptor input:checked + .trilho { background: var(--verde); }\n.interruptor input:checked + .trilho::after { transform: translateX(20px); }\n.interruptor input:focus-visible + .trilho { outline: 3px solid var(--ambar); }\n.campo { display: block; margin-bottom: 12px; }\n.campo > span { display: block; font-size: .85rem; color: var(--texto-2); margin-bottom: 4px; font-weight: 600; }\n.campo input, .campo select, .campo textarea { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--linha); border-radius: 8px; }\n.grade { display: grid; gap: 12px; }\n.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: 1fr 1fr 1fr; } .g4 { grid-template-columns: repeat(4, 1fr); }\n@media (max-width: 700px) { .g2, .g3, .g4 { grid-template-columns: 1fr 1fr; } }\n.cartao { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 16px; margin-bottom: 14px; }\n.cartao h2 { margin: 0 0 12px; font-size: 1rem; }\n.erro { background: var(--verm-esc); color: #ffb3bb; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-weight: 600; }\n.vazio { color: var(--texto-2); text-align: center; padding: 30px 10px; }\n.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--painel-2); color: var(--texto-2); }\n.pill.verde { background: var(--verde-esc); color: var(--verde); } .pill.verm { background: var(--verm-esc); color: var(--verm); } .pill.ambar { background: var(--ambar-esc); color: var(--ambar); }\n\n/* ---------- Login ---------- */\n.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }\n.login .cartao { width: min(400px, 100%); padding: 28px; }\n.login h1 { margin: 0 0 4px; font-size: 1.4rem; } .login p { margin: 0 0 20px; color: var(--texto-2); }\n\n/* ---------- Dashboard ---------- */\n.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }\n.kpi { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 16px; }\n.kpi small { color: var(--texto-2); font-weight: 600; }\n.kpi b { display: block; font-size: 1.7rem; margin-top: 4px; font-variant-numeric: tabular-nums; }\n.kpi.alerta { border-color: var(--ambar); background: var(--ambar-esc); }\n\n/* ---------- Central de pedidos ---------- */\n.colunas { display: grid; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 12px; }\n.col { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; min-height: 200px; }\n.col > h2 { margin: 0; padding: 12px 14px; font-size: .95rem; display: flex; justify-content: space-between; border-bottom: 1px solid var(--linha); }\n.col .lista { padding: 10px; display: flex; flex-direction: column; gap: 10px; }\n.col.novos { border-color: var(--ambar); }\n.col.novos > h2 { background: var(--ambar-esc); color: var(--ambar); }\n.pedido { background: var(--painel-2); border: 1px solid var(--linha); border-radius: 10px; padding: 12px; }\n.pedido.novo { border-color: var(--ambar); animation: piscar 1.4s ease-in-out infinite; }\n@keyframes piscar { 50% { box-shadow: 0 0 0 4px rgba(255,176,32,.25); } }\n@media (prefers-reduced-motion: reduce) { .pedido.novo { animation: none; box-shadow: 0 0 0 3px rgba(255,176,32,.35); } }\n.pedido .topo { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }\n.pedido .cod { font-family: var(--mono); font-weight: 800; font-size: 1.05rem; }\n.pedido .t { color: var(--texto-2); font-size: .82rem; }\n.pedido ul { list-style: none; margin: 8px 0; padding: 0; }\n.pedido li { padding: 4px 0; border-top: 1px dashed var(--linha); }\n.pedido li small { display: block; color: var(--texto-2); }\n.pedido .acoes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }\n.pedido .acoes .btn { flex: 1; }\n.det { color: var(--texto-2); font-size: .85rem; margin: 6px 0; }\n.det b { color: var(--texto); }\n\n/* ---------- Cardápio ---------- */\n.cat-t { display: flex; align-items: center; gap: 10px; margin: 20px 0 8px; }\n.cat-t h2 { margin: 0; font-size: 1.05rem; flex: 1; }\n.linha-prod { display: grid; grid-template-columns: 48px 1fr auto auto auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--painel); border: 1px solid var(--linha); border-radius: 10px; margin-bottom: 8px; }\n.linha-prod.off { opacity: .55; }\n.linha-prod img, .linha-prod .ph { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--painel-2); display: grid; place-items: center; color: var(--texto-2); font-weight: 800; }\n.linha-prod small { color: var(--texto-2); display: block; }\n.preco-edit { width: 100px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--linha); border-radius: 6px; text-align: right; font-variant-numeric: tabular-nums; }\n@media (max-width: 700px) { .linha-prod { grid-template-columns: 48px 1fr; } }\n\n.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50; display: grid; place-items: center; padding: 12px; }\n.modal { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; width: min(760px, 100%); max-height: 94vh; display: flex; flex-direction: column; }\n.modal > header { padding: 16px 20px; border-bottom: 1px solid var(--linha); display: flex; justify-content: space-between; align-items: center; }\n.modal > header h2 { margin: 0; font-size: 1.05rem; }\n.modal .corpo { padding: 16px 20px; overflow-y: auto; }\n.modal > footer { padding: 12px 20px; border-top: 1px solid var(--linha); display: flex; gap: 10px; justify-content: flex-end; }\n.grupo-ed { border: 1px solid var(--linha); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: var(--painel-2); }\n.op-ed { display: grid; grid-template-columns: 1fr 110px auto auto; gap: 8px; align-items: center; margin-bottom: 6px; }\n.op-ed input[type=text], .op-ed input:not([type]) { width: 100%; padding: 8px; background: var(--bg); border: 1px solid var(--linha); border-radius: 6px; }\n\n/* ---------- Financeiro ---------- */\n.barras { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; overflow-x: auto; }\n.barras div { flex: 1; min-width: 26px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: .7rem; color: var(--texto-2); }\n.barras span { width: 100%; background: var(--ambar); border-radius: 4px 4px 0 0; min-height: 2px; }\ntable { width: 100%; border-collapse: collapse; }\nth, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--linha); } th { color: var(--texto-2); font-size: .82rem; } td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }\n\n.faixa-som { background: var(--ambar-esc); border: 1px solid var(--ambar); color: var(--ambar); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 600; }\n.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 80; pointer-events: none; }\n.toast { background: var(--painel-2); border: 1px solid var(--ambar); padding: 12px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.5); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv id=\"shell\">\u003c/div>\n  \u003cdiv id=\"modal-root\">\u003c/div>\n  \u003cdiv id=\"toasts\" class=\"toasts\" role=\"status\" aria-live=\"polite\">\u003c/div>\n  \u003cscript>/* Dentro de cada site (iframe): troca fetch e EventSource pelo servidor simulado da página. O código do site não muda. */\n(() => {\n  const demo = () => window.parent.__demo;\n  window.fetch = (url, opts = {}) => new Promise((resolve) => {\n    const u = new URL(url, 'http://demo.local');\n    let body = {}; try { body = opts.body ? JSON.parse(opts.body) : {}; } catch { /* corpo vazio */ }\n    setTimeout(() => {\n      const r = demo().handle((opts.method || 'GET').toUpperCase(), u.pathname, Object.fromEntries(u.searchParams), body);\n      resolve(new Response(JSON.stringify(r.json), { status: r.status, headers: { 'Content-Type': 'application/json' } }));\n    }, 80);\n  });\n  // Num iframe com srcdoc, \"#/rota\" seria resolvido contra a página de fora e recarregaria tudo: trata só o trecho após \"#\".\n  document.addEventListener('click', (e) => {\n    const a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;\n    e.preventDefault();\n    const h = a.getAttribute('href');\n    if (location.hash === h) window.dispatchEvent(new HashChangeEvent('hashchange')); else location.hash = h;\n  }, true);\n  window.EventSource = class {\n    constructor(url) {\n      this.l = {};\n      const area = String(url).includes('/vendedor/') ? 'vendedor' : 'cliente';\n      this.off = demo().subscribe(area, (ev, data) => this._emit(ev, data));\n      setTimeout(() => (this.off ? this._emit('conectado', {}) : this.onerror && this.onerror()), 40);\n    }\n    addEventListener(name, fn) { (this.l[name] = this.l[name] || []).push(fn); }\n    _emit(name, data) { (this.l[name] || []).forEach((fn) => fn({ data: JSON.stringify(data) })); }\n    close() { if (this.off) this.off(); }\n  };\n})();\n\nwindow.APP_CONFIG = { API_URL: 'http://demo.local' };\u003c/script>\n  \u003cscript>/* Site do VENDEDOR (painel privado). Toda autorização real acontece na API; esta interface só reflete o que o servidor permite. */\n(() => {\n  'use strict';\n  const API = window.APP_CONFIG.API_URL;\n  const $shell = document.getElementById('shell');\n  const $modal = document.getElementById('modal-root');\n\n  // ---------- utilitários ----------\n  const esc = (s) => String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const brl = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n  const toCents = (s) => { const n = parseFloat(String(s).trim().replace(/\\./g, '').replace(',', '.')); return Number.isFinite(n) ? Math.round(n * 100) : NaN; };\n  const inCents = (c) => (c == null ? '' : (c / 100).toFixed(2).replace('.', ','));\n  const safeUrl = (u) => (/^https?:\\/\\//i.test(u || '') ? u : '');\n  const hora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });\n  const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];\n  const FORMAS = { pix: 'Pix', cartao_credito: 'Cartão de crédito', cartao_debito: 'Cartão de débito', dinheiro: 'Dinheiro' };\n\n  async function api(method, path, body) {\n    let res;\n    try { res = await fetch(API + path, { method, credentials: 'include', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined }); }\n    catch { throw Object.assign(new Error('Sem conexão com o servidor.'), { status: 0 }); }\n    const json = await res.json().catch(() => ({}));\n    if (res.status === 401 && me) { me = null; desconectar(); location.hash = '#/login'; }\n    if (!res.ok) throw Object.assign(new Error(json.erro || 'Algo deu errado.'), { status: res.status, codigo: json.codigo });\n    return json;\n  }\n  function toast(msg) {\n    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;\n    document.getElementById('toasts').append(el); setTimeout(() => el.remove(), 6000);\n  }\n\n  // ---------- campainha (exclusiva deste painel) ----------\n
