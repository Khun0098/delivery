<title>Açaí Papum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: coluna única de celular (máx 640px), cabeçalho roxo com borda de calda, lista de produtos estilo cardápio, barra fixa da sacola. */
:root{
  --bg:#f7f3fb; --surface:#ffffff; --fg:#26123a; --muted:#6d5a82; --line:#e4dbef;
  --brand:#3a1161; --brand-fg:#ffffff; --lime:#a6e03d; --lime-fg:#26123a; --danger:#b3261e;
  --head:'Fredoka','Trebuchet MS',sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150822; --surface:#221036; --fg:#f2eafa; --muted:#b5a3cc; --line:#3a2455; --brand:#2a0c4a; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150822; --surface:#221036; --fg:#f2eafa; --muted:#b5a3cc; --line:#3a2455; --brand:#2a0c4a; --danger:#ff8a80; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.topo{background:var(--brand);color:var(--brand-fg);margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:38px;position:relative}
header.topo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;background:
  radial-gradient(circle at 20px 0,var(--brand) 0 14px,transparent 15px) 0 0/48px 22px repeat-x;}
header.topo::before{content:"";position:absolute;left:0;right:0;bottom:-21px;height:22px;background:
  radial-gradient(circle at 20px 0,var(--brand) 0 14px,transparent 15px) 0 0/48px 22px repeat-x;z-index:1}
header.topo::after{display:none}
.marca{display:flex;align-items:center;gap:14px}
.logo{width:72px;height:72px;border-radius:50%;background:#1d0836;border:3px solid var(--lime);display:grid;place-items:center;flex:none;font-family:var(--head);font-weight:700;line-height:.9;text-align:center;font-size:20px}
.logo b{color:var(--lime);display:block;font-size:22px}
h1{font-family:var(--head);font-size:30px;line-height:1.05;margin:0;font-weight:700}
.slogan{margin:4px 0 0;color:var(--lime);font-weight:700}
.info{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.info span{background:rgba(255,255,255,.12);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700}
nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:22px}
nav.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px}
nav.cats button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 16px;font-weight:700;white-space:nowrap}
nav.cats button[aria-current=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
section.cat{padding-top:22px;scroll-margin-top:64px}
h2{font-family:var(--head);font-size:23px;margin:0 0 12px}
.lista{display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.item{width:100%;display:flex;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:stretch}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item h3{font-size:16px;margin:0;font-weight:800;line-height:1.25}
.item p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item img{width:96px;height:96px;border-radius:10px;object-fit:cover;flex:none;align-self:center}
.preco{margin-top:auto;padding-top:4px;font-weight:800;font-size:17px}
.preco s{color:var(--muted);font-weight:600;font-size:13px;margin-left:6px}
.preco i{font-style:normal;background:var(--lime);color:var(--lime-fg);border-radius:6px;padding:1px 7px;font-size:12px;margin-left:6px}
footer{padding-block:34px 140px;color:var(--muted);font-size:14px;text-align:center}
/* barra da sacola */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.barra button{display:flex;width:100%;max-width:608px;margin:0 auto;justify-content:space-between;align-items:center;background:var(--lime);color:var(--lime-fg);border:0;border-radius:14px;padding:15px 18px;font-weight:800;font-size:17px;box-shadow:0 6px 20px rgba(58,17,97,.35)}
/* folhas */
.veu{position:fixed;inset:0;z-index:20;background:rgba(15,5,25,.6);display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--surface);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.folha .corpo{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));flex:1}
.folha .pe{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.folha .cab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 0}
.x{border:0;background:var(--bg);border-radius:50%;width:38px;height:38px;font-size:20px;line-height:1;flex:none}
.foto-grande{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:12px}
.grupo{margin-top:18px}
.grupo h4{margin:0;font-size:16px;font-weight:800}
.grupo small{color:var(--muted);display:block;margin-bottom:6px}
.grupo .obrig{background:var(--brand);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;margin-left:8px;font-weight:700}
.op{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.op input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.op span{flex:1}.op em{font-style:normal;color:var(--muted);font-weight:700}
.op.off{opacity:.45}
.qtd{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px}
.qtd button{border:0;background:none;width:40px;height:44px;font-size:22px;font-weight:700}
.qtd output{min-width:26px;text-align:center;font-weight:800}
.btn{flex:1;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;padding:13px 16px;display:flex;justify-content:space-between;gap:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.lime{background:var(--lime);color:var(--lime-fg)}
.erro{color:var(--danger);font-weight:700;font-size:14px;margin:8px 0 0}
.aviso18{background:var(--bg);border-left:4px solid var(--danger);padding:8px 12px;border-radius:6px;margin-top:12px;font-size:14px}
textarea,input[type=text],input[type=tel],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg)}
label.campo{display:block;margin-top:14px;font-weight:700;font-size:14px}
label.campo>*:not(span){margin-top:5px;font-weight:400}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dois>*{min-width:0}
.sacola-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sacola-item .tx{flex:1;min-width:0}
.sacola-item .tx small{color:var(--muted);display:block}
.sacola-item button.rm{border:0;background:none;color:var(--danger);font-weight:700;padding:0;margin-top:4px;text-align:left}
.linha{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.linha.t{font-weight:800;font-size:18px}
.opcoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.opcoes label{border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.opcoes input{accent-color:var(--brand)}
pre.msg{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.4 var(--body);margin:10px 0}
a.btn{text-decoration:none;justify-content:center;text-align:center}
@media (prefers-reduced-motion:no-preference){.folha{animation:sobe .22s ease-out}@keyframes sobe{from{transform:translateY(40px);opacity:.6}}}
</style>

<header class="topo"><div class="wrap">
  <div class="marca">
    <div class="logo" aria-hidden="true"><span>Pá<b>Pum</b></span></div>
    <div><h1>Açaí Papum</h1><p class="slogan">Pediu, chegou, gelou!</p></div>
  </div>
  <div class="info">
    <span>Entrega grátis</span><span>43–53 min</span><span>Pedido mínimo R$ 9,90</span>
  </div>
</div></header>

<nav class="cats" aria-label="Categorias"><div class="wrap" id="cats"></div></nav>
<main class="wrap" id="menu"></main>
<footer class="wrap">Açaí Papum · Cardápio<br>Atendimento a partir das 13h</footer>

<div class="barra" id="barra" hidden><button id="abrirSacola" type="button"><span id="barraQtd"></span><span>Ver sacola</span><span id="barraTotal"></span></button></div>
<div id="camada"></div>

<script>
const WHATSAPP = ''; // coloque o número com DDI e DDD, ex.: '5511999999999'. Vazio = o cliente copia o pedido.
const IMG = {{IMGS}};
const GRATIS = ['Cereal chocoball','Paçoca','Granola','Coco ralado','Granulado de chocolate'];
const CALDAS = ['Caramelo','Leite condensado','Chocolate','Morango'];
const EXTRAS = ['Ovomaltine','Confetes de chocolates','Leite em pó','Granola','Paçoca','Nestón','Coco ralado','Granulado de chocolate'];
const grp = (id,t,d,min,max,nomes,p=0)=>({id,t,d,min,max,ops:nomes.map(n=>({n,p}))});
const CATS = [
 {id:'acai',nome:'Açaí e gourmet',itens:[
  {id:'acai',nome:'Açaí Artesanal de 200ml + 3 complementos grátis',desc:'Açaí cremoso, puro e geladinho, sem cristais de gelo. Escolha até 3 acompanhamentos grátis. Monte o seu.',p:1490,de:1990,img:'acai',grupos:[
    grp('g','Adicionais grátis','Escolha pelo menos 1 opção (até 3).',1,3,GRATIS),
    grp('c','Caldas','Escolha até 1 opção.',0,1,CALDAS),
    grp('e','Que tal acrescentar mais?','Escolha até 4 opções.',0,4,EXTRAS,250)]},
  {id:'combo',nome:'Combo Duas Tentações Cookies & Cream + Ferrero Rocher 200ml',desc:'Duas tentações em um só pedido! De um lado, a cremosidade irresistível do Cookies & Cream. Do outro, a explosão de sabor do Ferrero Rocher.',p:3890,de:5990,img:'combo',grupos:[]},
  {id:'cookies',nome:'Pápum Gourmet - Cookies & Cream',desc:'Creme de Cookies & Cream. Uma combinação irresistível de creme aveludado com o sabor inconfundível de Cookies.',p:2290,de:2990,img:'cookies',grupos:[]},
  {id:'ferrero',nome:'Pápum Gourmet - Trufadão Ferrero Rocher + 2 complementos grátis',desc:'O clássico bombom virou açaí! Copo intensamente recheado com camadas da legítima Nutella pura e a crocância irresistível do Ferrero Rocher.',p:2290,de:2990,img:'ferrero',grupos:[grp('g','Complementos grátis','Escolha até 2 opções.',0,2,GRATIS)]},
  {id:'ninho',nome:'Pápum Gourmet - Trufadão Ninho c/ Nutella + 2 complementos grátis',desc:'O verdadeiro trufado! Copo mega recheado com camadas generosas de Nutella pura e nosso exclusivo e cremoso creme de Ninho.',p:2290,de:2990,img:'ninho',grupos:[grp('g','Complementos grátis','Escolha até 2 opções.',0,2,GRATIS)]}]},
 {id:'bebidas',nome:'Bebidas',itens:[
  {id:'coca',nome:'Coca-Cola Pet Mini 200 ml',desc:'Garrafa 200ml.',p:399,img:'coca',grupos:[]},
  {id:'agua',nome:'Água Mineral com Gás 500ml Passa Quatro',desc:'Garrafa 500ml.',p:700,grupos:[]},
  {id:'heineken',nome:'Cerveja Heineken Latão',desc:'Cerveja Heineken latão.',p:1200,img:'heineken',grupos:[],r18:true}]}
];
const POR_ID = {}; CATS.forEach(c=>c.itens.forEach(i=>POR_ID[i.id]=i));
const R = c => (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const MIN = 990;
let sacola = [];
try { sacola = JSON.parse(localStorage.getItem('papum-sacola')||'[]').filter(l=>POR_ID[l.id]); } catch(e){}
let dados = {nome:'',tel:'',tipo:'entrega',rua:'',bairro:'',ref:'',pag:'pix',troco:'',obs:''};
try { Object.assign(dados, JSON.parse(localStorage.getItem('papum-dados')||'{}')); } catch(e){}
const salvar = () => { try{localStorage.setItem('papum-sacola',JSON.stringify(sacola));}catch(e){} };
const salvarDados = () => { try{localStorage.setItem('papum-dados',JSON.stringify(dados));}catch(e){} };
const precoLinha = l => { const i=POR_ID[l.id]; let u=i.p; i.grupos.forEach(g=>(l.sel[g.id]||[]).forEach(n=>u+=g.ops.find(o=>o.n===n).p)); return u*l.qtd; };
const subtotal = () => sacola.reduce((s,l)=>s+precoLinha(l),0);
const qtdTotal = () => sacola.reduce((s,l)=>s+l.qtd,0);

/* ---------- cardápio ---------- */
function desenharMenu(){
  $('#cats').innerHTML = CATS.map((c,i)=>`<button type="button" data-cat="${c.id}" aria-current="${i===0}">${esc(c.nome)}</button>`).join('');
  $('#menu').innerHTML = CATS.map(c=>`<section class="cat" id="cat-${c.id}"><h2>${esc(c.nome)}</h2><ul class="lista">${c.itens.map(i=>`
    <li><button type="button" class="item" data-id="${i.id}"><div class="tx"><h3>${esc(i.nome)}</h3><p>${esc(i.desc)}</p>
    <div class="preco">${R(i.p)}${i.de?`<s>${R(i.de)}</s><i>-${Math.round((1-i.p/i.de)*100)}%</i>`:''}</div></div>
    ${i.img?`<img src="${IMG[i.img]}" alt="" loading="lazy">`:''}</button></li>`).join('')}</ul></section>`).join('');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-cat]'); if(c){ document.getElementById('cat-'+c.dataset.cat).scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const it=e.target.closest('.item'); if(it) abrirProduto(it.dataset.id);
});
const secs=()=>[...document.querySelectorAll('section.cat')];
addEventListener('scroll',()=>{
  let atual=secs()[0]; secs().forEach(s=>{ if(s.getBoundingClientRect().top<120) atual=s; });
  document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-current',String('cat-'+b.dataset.cat===atual.id)));
},{passive:true});

/* ---------- folhas ---------- */
const camada=$('#camada');
function folha(html){ camada.innerHTML=`<div class="veu" id="veu"><div class="folha" role="dialog" aria-modal="true">${html}</div></div>`; document.body.style.overflow='hidden'; }
function fechar(){ camada.innerHTML=''; document.body.style.overflow=''; }
camada.addEventListener('click',e=>{ if(e.target.id==='veu'||e.target.closest('[data-fechar]')) fechar(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fechar(); });

function abrirProduto(id){
  const i=POR_ID[id]; const sel={}; let qtd=1; i.grupos.forEach(g=>sel[g.id]=[]);
  folha(`<div class="cab"><strong>${esc(i.nome)}</strong><button class="x" type="button" data-fechar aria-label="Fechar">×</button></div>
   <div class="corpo">${i.img?`<img class="foto-grande" src="${IMG[i.img]}" alt="">`:''}
   <p style="margin:0;color:var(--muted)">${esc(i.desc)}</p>
   ${i.r18?'<div class="aviso18">Venda proibida para menores de 18 anos. O documento pode ser pedido na entrega.</div>':''}
   ${i.grupos.map(g=>`<div class="grupo" data-g="${g.id}"><h4>${esc(g.t)}${g.min?'<span class="obrig">Obrigatório</span>':''}</h4><small>${esc(g.d)}</small>
     ${g.ops.map(o=>`<label class="op"><span>${esc(o.n)}</span>${o.p?`<em>+ ${R(o.p)}</em>`:''}<input type="checkbox" value="${esc(o.n)}"></label>`).join('')}</div>`).join('')}
   <label class="campo"><span>Observação (opcional)</span><textarea id="obsItem" rows="2" maxlength="140" placeholder="Ex.: sem granola"></textarea></label></div>
   <div class="pe"><div class="qtd"><button type="button" id="menos" aria-label="Diminuir">−</button><output id="q">1</output><button type="button" id="mais" aria-label="Aumentar">+</button></div>
   <button class="btn" type="button" id="add"><span>Adicionar</span><span id="tot"></span></button></div>`);
  const corpo=camada.querySelector('.corpo');
  const tem=l=>({id,qtd,sel,obs:''});
  const valido=()=>i.grupos.every(g=>sel[g.id].length>=g.min);
  function atualizar(){
    i.grupos.forEach(g=>{ const bloco=corpo.querySelector(`[data-g="${g.id}"]`); const cheio=sel[g.id].length>=g.max;
      bloco.querySelectorAll('.op').forEach(l=>{ const cb=l.querySelector('input'); cb.disabled=cheio&&!cb.checked; l.classList.toggle('off',cb.disabled); }); });
    $('#q').textContent=qtd; $('#tot').textContent=R(precoLinha({id,qtd,sel}));
    $('#add').disabled=!valido();
    $('#add').firstElementChild.textContent=valido()?'Adicionar':'Escolha os itens obrigatórios';
  }
  corpo.addEventListener('change',e=>{ const b=e.target.closest('[data-g]'); if(!b) return;
    sel[b.dataset.g]=[...b.querySelectorAll('input:checked')].map(x=>x.value); atualizar(); });
  $('#menos').onclick=()=>{ if(qtd>1){qtd--;atualizar();} };
  $('#mais').onclick=()=>{ if(qtd<20){qtd++;atualizar();} };
  $('#add').onclick=()=>{ if(!valido()) return;
    const obs=$('#obsItem').value.trim();
    const chave=JSON.stringify([id,sel,obs]);
    const ex=sacola.find(l=>l.chave===chave);
    if(ex) ex.qtd+=qtd; else sacola.push({chave,id,qtd,sel:JSON.parse(JSON.stringify(sel)),obs});
    salvar(); fechar(); barra(); };
  atualizar();
}

function barra(){
  const n=qtdTotal(); $('#barra').hidden=!n;
  $('#barraQtd').textContent=n+(n===1?' item':' itens'); $('#barraTotal').textContent=R(subtotal());
}
$('#abrirSacola').onclick=abrirSacola;

function resumoLinha(l){ const i=POR_ID[l.id]; const partes=[]; i.grupos.forEach(g=>{ if((l.sel[g.id]||[]).length) partes.push(l.sel[g.id].join(', ')); }); if(l.obs) partes.push('Obs: '+l.obs); return partes; }
function abrirSacola(){
  if(!sacola.length){ fechar(); barra(); return; }
  folha(`<div class="cab"><strong style="font-family:var(--head);font-size:20px">Sua sacola</strong><button class="x" type="button" data-fechar aria-label="Fechar">×</button></div>
  <div class="corpo">${sacola.map((l,ix)=>`<div class="sacola-item"><div class="tx"><strong>${l.qtd}× ${esc(POR_ID[l.id].nome)}</strong>${resumoLinha(l).map(p=>`<small>${esc(p)}</small>`).join('')}
    <button class="rm" type="button" data-rm="${ix}">Remover</button></div><strong>${R(precoLinha(l))}</strong></div>`).join('')}
   <div class="linha" style="margin-top:12px"><span>Subtotal</span><span>${R(subtotal())}</span></div>
   <div class="linha"><span>Entrega</span><span>Grátis</span></div>
   <div class="linha t"><span>Total</span><span>${R(subtotal())}</span></div>
   ${subtotal()<MIN?`<p class="erro">O pedido mínimo é ${R(MIN)}. Faltam ${R(MIN-subtotal())}.</p>`:''}</div>
  <div class="pe"><button class="btn" type="button" data-fechar style="background:var(--bg);color:var(--fg);flex:0 0 auto">Adicionar mais</button>
  <button class="btn lime" type="button" id="seguir" ${subtotal()<MIN?'disabled':''}><span>Continuar</span><span>${R(subtotal())}</span></button></div>`);
  camada.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ sacola.splice(+b.dataset.rm,1); salvar(); barra(); abrirSacola(); });
  $('#seguir').onclick=abrirDados;
}

function abrirDados(){
  const d=dados;
  folha(`<div class="cab"><strong style="font-family:var(--head);font-size:20px">Seus dados</strong><button class="x" type="button" data-fechar aria-label="Fechar">×</button></div>
  <form id="fd" novalidate><div class="corpo">
   <label class="campo"><span>Nome</span><input type="text" id="nome" autocomplete="name" value="${esc(d.nome)}"></label>
   <label class="campo"><span>WhatsApp com DDD</span><input type="tel" id="tel" autocomplete="tel" inputmode="tel" placeholder="(11) 99999-9999" value="${esc(d.tel)}"></label>
   <div class="campo"><span>Como quer receber?</span><div class="opcoes">
     <label><input type="radio" name="tipo" value="entrega" ${d.tipo==='entrega'?'checked':''}>Entrega</label>
     <label><input type="radio" name="tipo" value="retirada" ${d.tipo==='retirada'?'checked':''}>Retirar na loja</label></div></div>
   <div id="fend"><label class="campo"><span>Rua e número</span><input type="text" id="rua" autocomplete="street-address" value="${esc(d.rua)}"></label>
    <div class="dois"><label class="campo"><span>Bairro</span><input type="text" id="bairro" value="${esc(d.bairro)}"></label>
    <label class="campo"><span>Complemento</span><input type="text" id="ref" value="${esc(d.ref)}"></label></div></div>
   <div class="campo"><span>Pagamento na entrega</span><div class="opcoes">
     <label><input type="radio" name="pag" value="pix" ${d.pag==='pix'?'checked':''}>Pix</label>
     <label><input type="radio" name="pag" value="cartao" ${d.pag==='cartao'?'checked':''}>Cartão</label>
     <label><input type="radio" name="pag" value="dinheiro" ${d.pag==='dinheiro'?'checked':''}>Dinheiro</label></div></div>
   <label class="campo" id="ftroco"><span>Troco para quanto?</span><input type="text" id="troco" inputmode="decimal" placeholder="Ex.: 50" value="${esc(d.troco)}"></label>
   <label class="campo"><span>Observação para a loja (opcional)</span><textarea id="obs" rows="2" maxlength="200">${esc(d.obs)}</textarea></label>
   <p class="erro" id="err" role="alert" hidden></p></div>
  <div class="pe"><button class="btn" type="button" id="voltar" style="background:var(--bg);color:var(--fg);flex:0 0 auto">Voltar</button>
  <button class="btn lime" type="submit"><span>Revisar pedido</span><span>${R(subtotal())}</span></button></div></form>`);
  const f=$('#fd');
  const ajusta=()=>{ $('#fend').hidden=f.tipo.value==='retirada'; $('#ftroco').hidden=f.pag.value!=='dinheiro'; };
  f.addEventListener('change',ajusta); ajusta();
  $('#voltar').onclick=abrirSacola;
  f.addEventListener('submit',e=>{ e.preventDefault();
    Object.assign(dados,{nome:$('#nome').value.trim(),tel:$('#tel').value.trim(),tipo:f.tipo.value,rua:$('#rua').value.trim(),bairro:$('#bairro').value.trim(),ref:$('#ref').value.trim(),pag:f.pag.value,troco:$('#troco').value.trim(),obs:$('#obs').value.trim()});
    let m='';
    if(dados.nome.length<2) m='Informe seu nome.';
    else if(dados.tel.replace(/\D/g,'').length<10) m='Informe o WhatsApp com DDD.';
    else if(dados.tipo==='entrega'&&(dados.rua.length<3||dados.bairro.length<2)) m='Informe a rua, o número e o bairro para entrega.';
    if(m){ const er=$('#err'); er.textContent=m; er.hidden=false; return; }
    salvarDados(); abrirConfirmacao(); });
}

const FORMA={pix:'Pix',cartao:'Cartão',dinheiro:'Dinheiro'};
function textoPedido(){
  const L=['*Pedido - Açaí Papum*',''];
  sacola.forEach(l=>{ L.push(`${l.qtd}x ${POR_ID[l.id].nome} - ${R(precoLinha(l))}`); resumoLinha(l).forEach(p=>L.push('   '+p)); });
  L.push('', `Total: ${R(subtotal())} (entrega grátis)`, '');
  L.push(`Cliente: ${dados.nome}`,`WhatsApp: ${dados.tel}`);
  if(dados.tipo==='entrega'){ L.push(`Entrega: ${dados.rua}, ${dados.bairro}${dados.ref?' - '+dados.ref:''}`); } else L.push('Retirada na loja');
  L.push(`Pagamento: ${FORMA[dados.pag]}${dados.pag==='dinheiro'&&dados.troco?' (troco para R$ '+dados.troco+')':''}`);
  if(dados.obs) L.push(`Obs: ${dados.obs}`);
  return L.join('\n');
}
function abrirConfirmacao(){
  const txt=textoPedido();
  const zap=WHATSAPP?`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(txt)}`:'';
  folha(`<div class="cab"><strong style="font-family:var(--head);font-size:20px">Confirme seu pedido</strong><button class="x" type="button" data-fechar aria-label="Fechar">×</button></div>
  <div class="corpo"><pre class="msg" id="msg">${esc(txt)}</pre>
  <p style="color:var(--muted);margin:0">${WHATSAPP?'Ao enviar, o WhatsApp abre com o pedido pronto. A loja confirma por lá.':'Copie o pedido e envie para o WhatsApp da loja. Ela confirma por lá.'}</p>
  <p class="erro" id="ok" role="status" style="color:var(--fg)" hidden></p></div>
  <div class="pe"><button class="btn" type="button" id="voltar" style="background:var(--bg);color:var(--fg);flex:0 0 auto">Voltar</button>
  ${zap?`<a class="btn lime" id="enviar" href="${zap}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>`:`<button class="btn lime" type="button" id="copiar" style="justify-content:center">Copiar pedido</button>`}</div>`);
  $('#voltar').onclick=abrirDados;
  const fim=()=>{ sacola=[]; salvar(); barra(); };
  if(zap) $('#enviar').addEventListener('click',()=>setTimeout(fim,400));
  else $('#copiar').onclick=async()=>{
    let ok=false; try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){}
    if(!ok){ const r=document.createRange(); r.selectNodeContents($('#msg')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); try{ ok=document.execCommand('copy'); }catch(e){} }
    const o=$('#ok'); o.hidden=false; o.textContent=ok?'Pedido copiado. Cole no WhatsApp da loja.':'Texto selecionado. Copie e cole no WhatsApp da loja.';
  };
}
desenharMenu(); barra();
</script>
