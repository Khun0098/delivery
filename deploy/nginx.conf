# Exemplo de produção: cada site em seu próprio subdomínio, API separada.
# Certificados TLS (Let's Encrypt) e redirecionamento 80 -> 443 omitidos por brevidade.
#
# Variáveis da API em produção (arquivo deploy/.env.example):
#   NODE_ENV=production  TRUST_PROXY=1
#   CLIENTE_ORIGIN=https://cliente.delivery.com.br
#   VENDEDOR_ORIGIN=https://vendedor.delivery.com.br
#   ADMIN_ORIGIN=https://admin.delivery.com.br
#   PUBLIC_API_URL=https://api.delivery.com.br

map $host $csp_connect { default "https://api.delivery.com.br"; }

server {
  listen 443 ssl http2;
  server_name cliente.delivery.com.br;
  root /var/www/delivery/apps/cliente;
  index index.html;
  include /etc/nginx/snippets/delivery-security.conf;
  location / { try_files $uri $uri/ =404; }
}

server {
  listen 443 ssl http2;
  server_name vendedor.delivery.com.br;
  root /var/www/delivery/apps/vendedor;
  index index.html;
  include /etc/nginx/snippets/delivery-security.conf;
  # Opcional: restrinja por IP/VPN o painel do vendedor ou o admin.
  location / { try_files $uri $uri/ =404; }
}

server {
  listen 443 ssl http2;
  server_name admin.delivery.com.br;
  root /var/www/delivery/apps/admin;
  index index.html;
  include /etc/nginx/snippets/delivery-security.conf;
  # allow 203.0.113.0/24; deny all;   # exemplo: só a rede da empresa
  location / { try_files $uri $uri/ =404; }
}

server {
  listen 443 ssl http2;
  server_name api.delivery.com.br;
  client_max_body_size 4m;
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Necessário para o tempo real (Server-Sent Events):
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}

